# Rate-limit zone for the read-only datasource query API that scraping agents
# hit (see the /grafana/api/(ds/query|datasources) location below). Keyed on the
# client IP: ~10 req/s with a burst is ample for polling agents and caps
# expensive PromQL/LogQL queries from hammering Prometheus/Loki/Tempo.
limit_req_zone $binary_remote_addr zone=ds_api:10m rate=10r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# All plaintext traffic is redirected to HTTPS. The agent datasource token
# (Authorization: Bearer glsa_...) and the Grafana session cookie must never
# cross the public internet in cleartext — agents reach this edge from dynamic
# remote IPs, so TLS is the transport-security half of the barrier.
server {
    listen 80;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Dashboard filter URLs can carry long exclude_payment_methods lists.
    large_client_header_buffers 4 32k;

    # Cert + key are mounted from ./deploy/nginx/certs (gitignored — never
    # committed). In prod the CI deploy guard auto-creates/renews them on the VPS;
    # locally run deploy/nginx/gen-self-signed-cert.sh, or drop in a Let's Encrypt pair.
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:5m;

    resolver 127.0.0.11 ipv6=off valid=30s;

    # Auth is enforced by the application itself: dexMonitor serves a login page
    # and a Postgres-backed session cookie, and both dexMonitor and unified-api
    # require a valid session on their browser-facing API/WS routes. There is no
    # edge basic-auth layer anymore. Grafana enforces its own session/token auth.

    # Baseline security headers. Repeated in "location /" because nginx
    # add_header inheritance is all-or-nothing: a location that sets its own
    # add_header drops all server-level ones.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    # Internal-only routes must never be reachable from the public internet.
    # Without these, the catch-all "location /" below forwards them to the
    # dexMonitor app: POST /internal/live_offers is unauthenticated and writes to
    # the DB, and /metrics leaks Prometheus internals. Service-to-service calls
    # use the docker network directly and never traverse nginx, so blocking here
    # is safe. `^~` makes the prefix win over regex locations; 404 hides them.
    location ^~ /internal/ {
        return 404;
    }
    location = /metrics {
        return 404;
    }

    # Telegram's public callback is deliberately a single exact path. The
    # controller verifies X-Telegram-Bot-Api-Secret-Token before processing an
    # update; nginx forwards that header unchanged to the private upstream.
    location = /telegram-webhook {
        set $mmcontroller http://mm-controller:5001;
        proxy_pass       $mmcontroller;
        proxy_set_header Host $host;
    }

    # Phone payment callbacks are the only Fiat Controller routes exposed at
    # the public edge. Keep these exact paths: health, status and every other
    # controller route remain Docker-network-only. proxy_pass with a URI maps
    # the public namespace to the controller's private handler namespace.
    location = /pushpush/notify {
        client_max_body_size 1m;
        set $fiatcontroller http://fiat-controller:8080;
        proxy_pass       $fiatcontroller/notify;
        proxy_set_header Host $http_host;
    }
    location = /pushpush/phone-heartbeat {
        client_max_body_size 4k;
        set $fiatcontroller http://fiat-controller:8080;
        proxy_pass       $fiatcontroller/phone-heartbeat;
        proxy_set_header Host $http_host;
    }

    # Live offers WebSocket
    location /ws/live_offers {
        set $unifiedapi http://unified-api:5010;
        proxy_pass         $unifiedapi;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
		# Preserve the browser's host *and port*. The unified API validates the
		# WebSocket Origin against Host; using $host here strips :5443 and makes
		# legitimate dashboard connections look cross-origin.
		proxy_set_header   Host $http_host;
        proxy_read_timeout 86400s;
    }

    # Live offers REST + trade cost config
    location ~ ^/api/(live_offers|trade_cost_config|cex_permissions) {
        set $unifiedapi http://unified-api:5010;
        proxy_pass       $unifiedapi;
        proxy_set_header Host $host;
    }

    # Read-only datasource query API for scraping agents. These paths already
    # reach Grafana via the /grafana/ block below; this more-specific regex just
    # adds rate-limiting (regex wins over the /grafana/ prefix). Auth is
    # Grafana's own — agents send a Viewer service-account token, which Grafana
    # validates and which cannot mutate anything. Recipes + token creation:
    # deploy/monitoring/README.md.
    location ~ ^/grafana/api/(ds/query|datasources) {
        # Agents authenticate with Grafana Viewer service-account tokens; Grafana
        # validates the Bearer token itself.
        limit_req zone=ds_api burst=20 nodelay;
        set $grafana http://grafana:3000;
        proxy_pass         $grafana;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Grafana live (WebSocket) — must precede /grafana/ to match first
    location /grafana/api/live/ {
        set $grafana http://grafana:3000;
        proxy_pass         $grafana;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
    }

    # Grafana's Prometheus endpoint is unauthenticated by design. Prometheus
    # scrapes it on the docker network (grafana:3000/grafana/metrics); never
    # expose it through the public edge.
    location = /grafana/metrics {
        return 404;
    }

    # Grafana UI + API (sub-path mode via GF_SERVER_SERVE_FROM_SUB_PATH)
    location /grafana/ {
        set $grafana http://grafana:3000;
        proxy_pass         $grafana;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Everything else: frontend, past orders, OHLC, stats, etc.
    location / {
        # CSP for the SPA only (a server-wide policy would break Grafana).
        # 'unsafe-inline' styles: React style attributes; wss:: live offers WS.
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss:" always;
        # add_header here suppresses inherited server-level headers — repeat them.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        set $dexmonitor http://dexmonitor:5000;
        proxy_pass         $dexmonitor;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
