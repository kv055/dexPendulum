name: Branch cleanup

# Deletes remote branches that are already "implemented" (merged into develop or main).
# delete_branch_on_merge handles the head branch the moment a PR is merged via GitHub;
# this sweep catches what that misses — merge-commit merges, branches merged before that
# setting was enabled, and any failed auto-delete. main/develop and open-PR branches are
# never touched.

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List branches that would be deleted, without deleting"
        type: boolean
        default: true

permissions:
  contents: write # delete branch refs
  pull-requests: read # list open/merged PRs

concurrency:
  group: branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for ancestry (merge-base) checks

      - name: Delete merged branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Scheduled runs delete for real; manual runs default to a safe preview.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          set -Eeuo pipefail

          # Fetch every branch ref (checkout only brings the triggering ref).
          git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

          protected=(main develop)
          # Branches with an open PR must be kept (work in progress).
          mapfile -t open_heads < <(gh pr list --state open --limit 200 --json headRefName --jq '.[].headRefName')
          # Squash-merged branches are not ancestors of develop/main, so also treat any
          # branch with a merged PR as implemented.
          mapfile -t merged_heads < <(gh pr list --state merged --limit 200 --json headRefName --jq '.[].headRefName')

          in_list() { local x="$1"; shift; local e; for e in "$@"; do [ "$e" = "$x" ] && return 0; done; return 1; }

          deleted=0
          while read -r branch; do
            [ "$branch" = "HEAD" ] && continue
            in_list "$branch" "${protected[@]}" && continue
            in_list "$branch" "${open_heads[@]:-}" && continue

            implemented=false
            if git merge-base --is-ancestor "origin/$branch" origin/develop 2>/dev/null \
              || git merge-base --is-ancestor "origin/$branch" origin/main 2>/dev/null; then
              implemented=true
            elif in_list "$branch" "${merged_heads[@]:-}"; then
              implemented=true
            fi
            "$implemented" || continue

            if [ "$DRY_RUN" = "true" ]; then
              echo "would delete: $branch"
            else
              echo "deleting: $branch"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
              deleted=$((deleted + 1))
            fi
          done < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin)

          echo "branch-cleanup done (dry_run=${DRY_RUN}, deleted=${deleted})"
