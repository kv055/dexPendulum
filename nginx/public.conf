# Public monitor edge — co-hosted second vhost on the SAME nginx container as
# the operator dashboard (docker-compose.yml service "nginx"). This file is the
# security boundary of the public deployment: default deny. Only the read
# routes the dex Monitor and Statistics tabs call reach the apps; the
# execution panel's trading calls get a canned JSON answer; every other /api/
# and /ws/ path is 404. The apps add a second layer (PUBLIC_EDITION=true
# opens only these same read routes; everything else needs a login, and the
# public deployment has no users).
#
# It is a server-block template, not active config: nginx renders files from
# /etc/nginx/templates/*.template (envsubst) at container start. Until a
# public domain exists it stays unmounted (see deploy/public/README.md — the
# public instance itself runs unpublished, preview via its loopback port).
# To activate:
#   1. point PUBLIC_MONITOR_HOSTNAME's DNS at this server,
#   2. issue TLS material into deploy/nginx/certs/public/{server.crt,server.key},
#   3. mount this file into the nginx service and set the env var:
#        nginx:
#          environment:
#            - PUBLIC_MONITOR_HOSTNAME=<your host>
#          volumes:
#            - ./nginx/public.conf:/etc/nginx/templates/public.conf.template:ro
#            - ./deploy/nginx/certs/public:/etc/nginx/certs/public:ro
#   4. docker compose up -d --force-recreate --no-deps nginx
# The operator vhost (nginx/nginx.conf, server_name _) is untouched; this
# block only ever matches its own server_name.
#
# scripts/public-edge-check.sh asserts this behaviour against a running edge.

limit_req_zone $binary_remote_addr zone=public_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=public_ws_per_ip:10m;
# Keyed on the server name, so it caps concurrent analytics requests in total.
limit_conn_zone $server_name zone=public_analytics_total:1m;

proxy_cache_path /var/cache/nginx/public levels=1:2 keys_zone=public_cache:10m
                 max_size=256m inactive=10m use_temp_path=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name ${PUBLIC_MONITOR_HOSTNAME};

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${PUBLIC_MONITOR_HOSTNAME};

    # Dashboard filter URLs can carry long exclude_payment_methods lists.
    large_client_header_buffers 4 32k;

    ssl_certificate     /etc/nginx/certs/public/server.crt;
    ssl_certificate_key /etc/nginx/certs/public/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:5m;

    resolver 127.0.0.11 ipv6=off valid=30s;

    limit_req_status  429;
    limit_conn_status 429;

    # Security headers. nginx drops server-level add_header in any location
    # that sets its own, so every location below repeats them.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    # --- Default deny ------------------------------------------------------
    location /api/ {
        return 404;
    }
    location /ws/ {
        return 404;
    }
    location ^~ /internal/ {
        return 404;
    }
    location = /metrics {
        return 404;
    }
    # The trading deployment's Grafana path; there is no public Grafana.
    location ^~ /grafana/ {
        return 404;
    }

    # --- Execution panel: canned answer instead of the Taker Controller ----
    # The panel shows the message field. Until the "Start trade" explainer
    # exists, this is what a viewer sees when the panel would quote or trade.
    location ~ ^/api/(execution-quotes|mm-controller/(bisq/execution/(quote|accept)|cex/(pre-trade-check|tradeflow|withdrawal-track)|transactions/[^/]+))$ {
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        return 503 "{\"code\":\"public_monitor\",\"message\":\"Trading isn't available on the public monitor.\"}";
    }

    # --- unified-api read routes (public listener :5011) --------------------
    location = /ws/live_offers {
        limit_conn public_ws_per_ip 4;
        set $unifiedapi http://unified-api:5011;
        proxy_pass         $unifiedapi;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        # unified-api validates the WebSocket Origin against Host (with port).
        proxy_set_header   Host $http_host;
        proxy_read_timeout 86400s;
    }

    location ~ ^/api/live_offers(/counts|/[^/]+/lifecycle)?$ {
        limit_except GET { deny all; }
        limit_req zone=public_api burst=30 nodelay;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        set $unifiedapi http://unified-api:5011;
        proxy_pass       $unifiedapi;
        proxy_set_header Host $host;
    }

    location ~ ^/api/(trade_cost_config|cex_permissions)$ {
        limit_except GET { deny all; }
        limit_req zone=public_api burst=30 nodelay;
        proxy_cache public_cache;
        proxy_cache_valid 200 60s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        proxy_ignore_headers Cache-Control Expires;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        set $unifiedapi http://unified-api:5011;
        proxy_pass       $unifiedapi;
        proxy_set_header Host $host;
    }

    # --- dexmonitor-public read routes --------------------------------------
    location ~ ^/api/(past_offers|ohlc|payment_method_groups|past_offers/[^/]+/lifecycle)$ {
        limit_except GET { deny all; }
        limit_req zone=public_api burst=30 nodelay;
        proxy_cache public_cache;
        proxy_cache_valid 200 30s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        proxy_ignore_headers Cache-Control Expires;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        set $dexmonitor http://dexmonitor-public:5000;
        proxy_pass         $dexmonitor;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Heavy analytics: cached by request body and capped at 4 in flight in
    # total, so a burst of viewers cannot push the instance past its memory
    # limit.
    location ~ ^/api/(dashboard/analytics|statistics)$ {
        limit_except POST { deny all; }
        limit_req  zone=public_api burst=30 nodelay;
        limit_conn public_analytics_total 4;
        # The body must be buffered in memory to be part of the cache key.
        client_max_body_size    64k;
        client_body_buffer_size 64k;
        proxy_cache public_cache;
        proxy_cache_methods POST;
        proxy_cache_key "$request_method|$request_uri|$request_body";
        proxy_cache_valid 200 60s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 60s;
        proxy_cache_use_stale updating error timeout;
        proxy_ignore_headers Cache-Control Expires;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        set $dexmonitor http://dexmonitor-public:5000;
        proxy_pass         $dexmonitor;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Uptime checks.
    location = /health {
        limit_except GET { deny all; }
        set $dexmonitor http://dexmonitor-public:5000;
        proxy_pass       $dexmonitor;
        proxy_set_header Host $host;
    }

    # --- SPA and static assets ----------------------------------------------
    location / {
        limit_except GET { deny all; }
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss:" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        set $dexmonitor http://dexmonitor-public:5000;
        proxy_pass         $dexmonitor;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
