  fiat-controller:
    logging: *default-logging
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-kv055}/dexarbtrading-fiat-controller:${FIAT_CONTROLLER_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    env_file:
      - ./dexFiatController/.env
    # The controller is private. nginx is the only public path and exposes
    # only the exact /pushpush/notify and /pushpush/phone-heartbeat callbacks.
    expose:
      - "8080"
    volumes:
      - fiat-controller-data:/data
      - ${MADDY_TLS_DIR:-./deploy/maddy/tls}:/maddy-tls:ro
    depends_on:
      # totp-api is disabled above.
      postgres:
        condition: service_healthy
      # The migration command prepares the shared schema before app activation;
      # Unified API checks migration history before reporting healthy.
      unified-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      # DATABASE_URL comes from dexFiatController/.env. Compose expands
      # ${...} before loading env_file, so constructing it here would replace
      # that valid value with empty root-level credentials.
      # Scraping browser automation is off by default (SCRAPING_ENABLED=false).
      # Re-enable these together with Chromium in dexFiatController/Dockerfile
      # when turning scraping back on.
      # - HEADLESS=true
      # - CHROME_PATH=/usr/bin/chromium-browser
      # - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # - TOTP_API_URL=http://totp-api:8080
      # - TOTP_API_KEY=${TOTP_API_KEY:-}
      # - SMS_PROVIDER=${SMS_PROVIDER:-}
      # - SMS_ACCOUNT_SID=${SMS_ACCOUNT_SID:-}
      # - SMS_AUTH_TOKEN=${SMS_AUTH_TOKEN:-}
      # - SMS_PHONE_NUMBER=${SMS_PHONE_NUMBER:-}
      # - EMAIL_PROVIDER=${EMAIL_PROVIDER:-}
      # - EMAIL_IMAP_HOST=${EMAIL_IMAP_HOST:-}
      # - EMAIL_IMAP_USER=${EMAIL_IMAP_USER:-}
      # - EMAIL_IMAP_PASS=${EMAIL_IMAP_PASS:-}
      # - POLL_INTERVAL=${POLL_INTERVAL:-30s}
      # - PAYMENT_NOTIFICATIONS_API_URL=${PAYMENT_NOTIFICATIONS_API_URL:-http://unified-api:5010/internal/payment_notifications}
      # - PAYMENT_NOTIFICATIONS_SHARED_SECRET=${PAYMENT_NOTIFICATIONS_SHARED_SECRET:-}
      # - PAYMENT_NOTIFICATIONS_DEX=${PAYMENT_NOTIFICATIONS_DEX:-}
      # pushpush (primary fiat-arrival path)
      - SCRAPING_ENABLED=${SCRAPING_ENABLED:-false}
      - PUSHPUSH_ADDR=:8080
      - PUSHPUSH_NOTIFY_SECRET=${PUSHPUSH_NOTIFY_SECRET:-}
      - PUSHPUSH_HEARTBEAT_MAX_AGE=${PUSHPUSH_HEARTBEAT_MAX_AGE:-15m}
      # Payment-ingestion IMAP settings are intentionally separate from
      # EMAIL_IMAP_* used by the scraping connector for email 2FA.
      - PAYMENT_EMAIL_MODE=${PAYMENT_EMAIL_MODE:-capture}
      - PAYMENT_EMAIL_IMAP_HOST=${PAYMENT_EMAIL_IMAP_HOST:-maddy}
      - PAYMENT_EMAIL_IMAP_PORT=993
      - PAYMENT_EMAIL_IMAP_USER=${MADDY_RECIPIENT:-payments@example.invalid}
      - PAYMENT_EMAIL_IMAP_PASS=${MADDY_IMAP_PASSWORD:-}
      - PAYMENT_EMAIL_IMAP_MAILBOX=INBOX
      - PAYMENT_EMAIL_TLS_SERVER_NAME=${MADDY_HOSTNAME:-mx.example.invalid}
      - PAYMENT_EMAIL_TLS_CA_FILE=${PAYMENT_EMAIL_TLS_CA_FILE:-/maddy-tls/fullchain.pem}
      - PAYMENT_EMAIL_POLL_INTERVAL=${PAYMENT_EMAIL_POLL_INTERVAL:-5m}
      - PAYMENT_EMAIL_HEALTH_MAX_AGE=${PAYMENT_EMAIL_HEALTH_MAX_AGE:-15m}
      - PAYMENT_EMAIL_ACTIVATION_UID=${PAYMENT_EMAIL_ACTIVATION_UID:-0}
      - PAYMENT_EMAIL_ACTIVATION_TIME=${PAYMENT_EMAIL_ACTIVATION_TIME:-}
      - PUSHPUSH_DATA_DIR=/data
      - PUSHPUSH_DEX_RELEASE_URL=${PUSHPUSH_DEX_RELEASE_URL:-http://dexmmcontroller:8080/api/webhooks/dex-release}
      - PUSHPUSH_DEX_RELEASE_TOKEN=${PUSHPUSH_DEX_RELEASE_TOKEN:-}
      - PUSHPUSH_RELEASE_TIMEOUT=${PUSHPUSH_RELEASE_TIMEOUT:-10s}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - PUSHPUSH_TELEGRAM_WEBHOOK_URL=${PUSHPUSH_TELEGRAM_WEBHOOK_URL:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.0'
    restart: unless-stopped

  prometheus:
    logging: *default-logging
    image: prom/prometheus:v3.16.0
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    restart: unless-stopped

  grafana:
    logging: *default-logging
    image: grafana/grafana:13.3.1
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      # Read-only Postgres datasource credentials, interpolated into
      # provisioning/datasources/postgres.yml by Grafana. The dex_grafana_ro
      # role is bootstrapped by unified-api when the password is set.
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_GRAFANA_RO_PASSWORD=${POSTGRES_GRAFANA_RO_PASSWORD:-}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: '0.25'
    restart: unless-stopped

  node-exporter:
    logging: *default-logging
    image: prom/node-exporter:v1.12.1
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|var/lib/docker/.+)($$|/)
    volumes:
      - /:/host:ro,rslave
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
    restart: unless-stopped

  cadvisor:
    logging: *default-logging
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    restart: unless-stopped

  postgres-exporter:
    logging: *default-logging
    image: prometheuscommunity/postgres-exporter:v0.20.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATA_SOURCE_NAME=postgres://${POSTGRES_ADMIN_USER}:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    command:
      - --no-collector.stat_bgwriter
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
    restart: unless-stopped

  # --- OpenTelemetry log + trace backend (viewed via the existing Grafana) ---

  loki:
    logging: *default-logging
    image: grafana/loki:3.7.10
    command:
      - -config.file=/etc/loki/config.yml
    volumes:
      - ./deploy/monitoring/loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    restart: unless-stopped

  tempo:
    logging: *default-logging
    # Held on 2.x: Tempo 3 drops the ingester/compactor blocks tempo.yml uses and
    # refuses to start with it. Migrate the config before lifting the
    # renovate.json rule that blocks the major bump.
    image: grafana/tempo:2.7.1
    command:
      - -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./deploy/monitoring/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    deploy:
      resources:
        limits:
          # 384M not the agent's proposed 192M: tempo OOM-killed at 259M RSS, so
          # 192M would crash it again. The other monitoring reductions are kept.
          memory: 384M
          cpus: '0.5'
    restart: unless-stopped

  alloy:
    logging: *default-logging
    image: grafana/alloy:v1.22.0
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./deploy/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      # Read-only docker socket for container log discovery. See the security
      # note in deploy/monitoring/alloy/config.alloy.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
      - tempo
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    restart: unless-stopped

  # One local Swagger UI for all service-owned OpenAPI documents. It is kept
  # behind the docs profile and bound to loopback because internal/admin routes
  # are included in the bundled contracts.
  api-docs:
    image: swaggerapi/swagger-ui:v5.35.0
    profiles:
      - docs
    environment:
      URLS: >-
        [{"name":"dexUnifiedApi — public","url":"/specs/dex-unified-api/public.openapi.yaml"},{"name":"dexUnifiedApi — internal","url":"/specs/dex-unified-api/internal.openapi.yaml"},{"name":"dexTakerController — public","url":"/specs/dex-mm-controller/public.openapi.yaml"},{"name":"dexTakerController — internal","url":"/specs/dex-mm-controller/internal.openapi.yaml"},{"name":"dexMonitor — public","url":"/specs/dex-monitor/public.openapi.yaml"},{"name":"dexMonitor — bisqstats","url":"/specs/dex-monitor/bisqstats.public.openapi.yaml"},{"name":"dexFiatController — public","url":"/specs/dex-fiat-controller/public.openapi.yaml"},{"name":"dexFiatController — internal","url":"/specs/dex-fiat-controller/internal.openapi.yaml"}]
      URLS_PRIMARY_NAME: dexMonitor — public
      DISPLAY_REQUEST_DURATION: "true"
      PERSIST_AUTHORIZATION: "true"
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./api-docs/specs:/usr/share/nginx/html/specs:ro
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
    restart: unless-stopped

volumes:
  postgres-data:
  postgres-backups:
  bisq-data:
  bisq2-data:
  # mm-controller-data:
  fiat-controller-data:
  maddy-data:
  maddy-backups:
  lnd-data:
  # The prior lnd-data volume is intentionally retained for recovery. New
  # wallet initialization uses this isolated volume.
  lnd-data-fresh:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
  alloy-data:

networks:
  default:
    name: dexarbtrading
