# Gitea CI/CD workflow.
#
# GitHub never reads .gitea/, so this file does NOT affect GitHub CI. Gitea, once a
# .gitea/workflows/ file exists, uses it and ignores .github/workflows/ — so on Gitea
# only this runs.
#
# develop: test + build (push images to Gitea registry) + open develop→main PR
# main:    skip tests; build (push images to GHCR) + pre-deploy + deploy to VPS
name: ci

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - '.codex'
      - '.agents/**'
      - 'deploy/provision/**'
      - 'dexTakerController/docs/**'
      - 'dexMonitor/docs/**'
      - 'dexUnifiedApi/docs/**'
      - 'dexMmTradingLogicHummingBot/**'
      - '.gitignore'
      - 'LICENSE'

env:
  # Release tag (v-prefixed) + SHA-256 of its linux_x64 tarball; Renovate bumps
  # both together (github-release-attachments computes the new digest).
  GITLEAKS_VERSION: v8.30.1
  GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  security:
    name: Secret protection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch submodules from the Gitea mirror
        run: |
          host="${REGISTRY_URL#*://}"; scheme="${REGISTRY_URL%%://*}"
          git config --global url."${scheme}://x-access-token:${REG_TOKEN}@${host}/${OWNER}/".insteadOf "https://github.com/kv055/"
          git submodule update --init --recursive
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REG_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          OWNER: ${{ github.repository_owner }}

      - name: Validate encrypted environment contract
        run: bash scripts/validate-env-contract.sh keys

      - name: Install Gitleaks
        run: |
          set -Eeuo pipefail
          install_dir=$(mktemp -d)
          trap 'rm -rf "$install_dir"' EXIT
          archive="$install_dir/gitleaks.tar.gz"
          bin_dir="${RUNNER_TEMP:-$HOME/.local}/gitleaks-${GITLEAKS_VERSION}"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" -o "$archive"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum -c -
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$install_dir" gitleaks
          install "$install_dir/gitleaks" "$bin_dir/gitleaks"
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"

      - name: Reject plaintext dotenv files
        run: |
          set -Eeuo pipefail
          offending=()
          while IFS= read -r -d '' path; do
            basename=${path##*/}
            case "$basename" in
              .env|.env.*)
                case "$basename" in
                  *.enc|*.example) ;;
                  *) offending+=("$path") ;;
                esac
                ;;
            esac
          done < <(find . -type d -name .git -prune -o -type f \( -name '.env' -o -name '.env.*' \) -print0)
          if ((${#offending[@]})); then
            printf 'ERROR: plaintext dotenv files are forbidden in the checkout:\n' >&2
            printf '  %s\n' "${offending[@]}" >&2
            exit 1
          fi

      - name: Scan root and submodule snapshot
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner

  database-sql-integrity:
    name: Database SQL immutability
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch submodules from the Gitea mirror
        run: |
          host="${REGISTRY_URL#*://}"; scheme="${REGISTRY_URL%%://*}"
          git config --global url."${scheme}://x-access-token:${REG_TOKEN}@${host}/${OWNER}/".insteadOf "https://github.com/kv055/"
          git submodule update --init --recursive
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REG_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          OWNER: ${{ github.repository_owner }}

      - name: Reject changed database SQL history
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "Manual run has no change range; skipping database SQL immutability check."
            exit 0
          fi
          base="$BEFORE"; head="$AFTER"
          if [ -z "$base" ] || [ "$base" = "$zero" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base=$(git rev-parse "${head}^" 2>/dev/null || true)
          fi
          [ -n "$base" ] || { echo "No usable base commit; refusing to skip database SQL immutability check." >&2; exit 1; }
          old=$(git ls-tree "$base" dexUnifiedApi | awk '{print $3}')
          new=$(git ls-tree "$head" dexUnifiedApi | awk '{print $3}')
          [ -n "$old" ] && [ -n "$new" ] || { echo "Unable to resolve dexUnifiedApi submodule revisions." >&2; exit 1; }
          [ "$old" != "$new" ] || { echo "dexUnifiedApi submodule is unchanged."; exit 0; }
          # SQL immutability was introduced with this dexUnifiedApi revision.
          # Older target branches may include the pre-policy schema squash in
          # their diff, so begin enforcement at the known-good boundary.
          sql_history_baseline=12fbf354ed04922471acafd6af1f017a7402c611
          git -C dexUnifiedApi fetch --no-tags origin "$old" "$new" "$sql_history_baseline"
          git -C dexUnifiedApi fetch --no-tags origin main || true
          if git -C dexUnifiedApi merge-base --is-ancestor "$old" "$sql_history_baseline" \
            && git -C dexUnifiedApi merge-base --is-ancestor "$sql_history_baseline" "$new"; then
            echo "Using SQL immutability baseline $sql_history_baseline (target revision $old predates enforcement)."
            old="$sql_history_baseline"
          fi

          violations=()
          while IFS=$'\t' read -r status first second; do
            [ -n "$status" ] || continue
            if [ "${status:0:1}" = A ] && [[ "$first" == db/migrations/*.sql ]] \
              && [[ "${first##*/}" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
              echo "allowed new migration: $first"
              continue
            fi
            if [ "$status" = M ] && [[ "$first" == db/schema/* ]]; then
              new_blob=$(git -C dexUnifiedApi rev-parse "$new:$first")
              restored=0
              while IFS= read -r c; do
                [ -n "$c" ] || continue
                git -C dexUnifiedApi cat-file -e "$c:$first" 2>/dev/null || continue
                if [ "$(git -C dexUnifiedApi rev-parse "$c:$first")" = "$new_blob" ]; then
                  restored=1
                  break
                fi
              done < <(git -C dexUnifiedApi log --pretty=%H "$old" -- "$first")
              if [ "$restored" = 1 ]; then
                echo "allowed historical restore: $first"
                continue
              fi
            fi
            violations+=("$status $first${second:+ -> $second}")
          done < <(git -C dexUnifiedApi diff --name-status --find-renames "$old" "$new" -- db/schema db/migrations)

          if ((${#violations[@]})); then
            printf 'ERROR: existing database SQL is immutable. Add only new timestamped migrations under db/migrations/.\n' >&2
            printf '  %s\n' "${violations[@]}" >&2
            exit 1
          fi

  detect-changes:
    # Diff the push range and decide which tests and image builds run.
    name: Detect changed services
    needs: security
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.detect.outputs.changes }}
      test_modules: ${{ steps.detect.outputs.test_modules }}
      test_modules_json: ${{ steps.detect.outputs.test_modules_json }}
      run_frontend: ${{ steps.detect.outputs.run_frontend }}
      build_services_json: ${{ steps.detect.outputs.build_services_json }}
      deploy_main: ${{ steps.deploy.outputs.main }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Need the push's "before" commit available locally to diff the full
          # pushed range (a push can carry several commits / a merge).
          fetch-depth: 0
      - name: Fetch detection submodules from the Gitea mirror
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REG_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          host="${REGISTRY_URL#*://}"; scheme="${REGISTRY_URL%%://*}"
          git config --global url."${scheme}://x-access-token:${REG_TOKEN}@${host}/${OWNER}/".insteadOf "https://github.com/kv055/"
          git submodule update --init --recursive
      - name: Read production image baseline
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_name == 'main' || github.event.ref == 'refs/heads/main')
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          REPO_DIR: ${{ secrets.VPS_REPO_DIR }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%b\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%b\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          python3 scripts/release-images.py ci-baseline --output release-artifacts/baseline.json
      - uses: actions/upload-artifact@v3
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_name == 'main' || github.event.ref == 'refs/heads/main')
        with:
          name: production-baseline
          path: release-artifacts/baseline.json
          if-no-files-found: error
      - name: Determine changed services
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_REF: ${{ github.event.ref }}
          BASELINE_FILE: release-artifacts/baseline.json
        run: bash scripts/detect-changed-services.sh

      # Gitea act often leaves github.ref empty when evaluating downstream job `if`
      # expressions; resolve deploy intent once here from every context field act sets.
      - name: Detect main-branch deploy
        id: deploy
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_REF: ${{ github.event.ref }}
        run: |
          deploy=false
          if [ "$EVENT" = "push" ]; then
            [ "$REF" = "refs/heads/main" ] && deploy=true
            [ "${REF_NAME:-}" = "main" ] && deploy=true
            # Fallback for runners that leave the runner-level ref empty but
            # still populate the event payload.
            [ "${EVENT_REF:-}" = "refs/heads/main" ] && deploy=true
          fi
          echo "main=${deploy}" >> "$GITHUB_OUTPUT"
          echo "deploy_main: event=${EVENT} ref=${REF} ref_name=${REF_NAME} event_ref=${EVENT_REF} -> ${deploy}"

  release-protocol:
    name: Image detection and deployment regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          set -Eeuo pipefail
          bash scripts/test-image-service-inputs.sh
          bash scripts/test-bisq-pins.sh
          python3 scripts/test-release-images.py
          bash deploy/test-transactional-deploy.sh
          DEPLOY_TEST_DIGEST=1 bash deploy/test-transactional-deploy.sh
          bash deploy/test-ci-activate.sh
          bash deploy/test-prune-images.sh

  test-go:
    name: Go tests (${{ matrix.module }})
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.deploy_main != 'true' &&
      needs.detect-changes.outputs.test_modules != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Gitea act does not fan out fromJson(needs.*.outputs) matrices — keep a
      # static list and skip unchanged modules per job (see build-and-push).
      matrix:
        module: [commons, dexUnifiedApi, dexTakerController, dexMonitor, dexFiatController]
    steps:
      - name: Check if this module needs testing
        id: check
        env:
          MODULES: ${{ needs.detect-changes.outputs.test_modules }}
          MODULE: ${{ matrix.module }}
        run: |
          if case ",$MODULES," in *",$MODULE,"*) true;; *) false;; esac; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "$MODULE -> testing"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "$MODULE unchanged -> skipping"
          fi

      - uses: actions/checkout@v7
        if: steps.check.outputs.run == 'true'
      - name: Fetch submodules from the Gitea mirror
        if: steps.check.outputs.run == 'true'
        run: |
          host="${REGISTRY_URL#*://}"; scheme="${REGISTRY_URL%%://*}"
          git config --global url."${scheme}://x-access-token:${REG_TOKEN}@${host}/${OWNER}/".insteadOf "https://github.com/kv055/"
          git submodule update --init --recursive
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REG_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          OWNER: ${{ github.repository_owner }}

      - uses: actions/setup-go@v7
        if: steps.check.outputs.run == 'true'
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          # Go/npm caches are persistent volumes the runner mounts into every job
          # (deploy/provision/gitea/runner-config.yaml), so the tarball cache is off:
          # packing/unpacking ~250 MB per job costs more than it saves on this host.
          cache: false

      - name: Run tests
        if: steps.check.outputs.run == 'true'
        working-directory: ${{ matrix.module }}
        run: go test ./...

  bisq-patches-apply:
    # Fast guard (seconds, not the full image build): prove the bisq source
    # patches still apply against the pinned BISQ_COMMIT. Mirrors the job of
    # the same name in .github/workflows/ci-cd.yml — without it, a patch that
    # no longer applies is only caught deep inside the from-source bisq build.
    name: Bisq patches apply cleanly
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.deploy_main != 'true' &&
      contains(needs.detect-changes.outputs.changes, 'bisq')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch submodules from the Gitea mirror
        run: |
          host="${REGISTRY_URL#*://}"; scheme="${REGISTRY_URL%%://*}"
          git config --global url."${scheme}://x-access-token:${REG_TOKEN}@${host}/${OWNER}/".insteadOf "https://github.com/kv055/"
          git submodule update --init --recursive dexUnifiedApi
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REG_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          OWNER: ${{ github.repository_owner }}

      - name: Clone pinned bisq and apply patches
        run: |
          set -Eeuo pipefail
          # Fail closed on a missing/malformed pin or a floating-tag clone
          # (Gitea run #348); verifies exactly what the image builds.
          eval "$(bash "$GITHUB_WORKSPACE/scripts/bisq-pin-args.sh" \
            "$GITHUB_WORKSPACE/dexUnifiedApi/Dockerfile.bisq")"
          echo "Checking patches against bisq v${BISQ_VERSION} @ ${BISQ_COMMIT}"
          # bisq-network is NOT rewritten by the mirror insteadOf (kv055 only),
          # so this fetch goes to real github.com. Fetch the pinned commit —
          # never the floating tag — so the check verifies exactly what the
          # image builds (a tag re-cut must not slip past this job).
          git init -q /tmp/bisq
          git -C /tmp/bisq remote add origin https://github.com/bisq-network/bisq.git
          git -C /tmp/bisq fetch --depth 1 origin "$BISQ_COMMIT"
          git -C /tmp/bisq checkout -q --detach FETCH_HEAD
          git -C /tmp/bisq submodule update --init --recursive --depth 1
          for p in "$GITHUB_WORKSPACE"/dexUnifiedApi/bisq-patches/*.patch; do
            echo "applying $(basename "$p")"
            git -C /tmp/bisq apply --3way "$p"
          done
          echo "All patches apply cleanly against v${BISQ_VERSION} @ ${BISQ_COMMIT}."

  openapi:
    name: OpenAPI source-of-truth check
    needs: [security, detect-changes]
    if: needs.detect-changes.outputs.deploy_main != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch submodules from the Gitea mirror
        run: |
          host="${REGISTRY_URL#*://}"; scheme="${REGISTRY_URL%%://*}"
          git config --global url."${scheme}://x-access-token:${REG_TOKEN}@${host}/${OWNER}/".insteadOf "https://github.com/kv055/"
          git submodule update --init --recursive
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REG_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          OWNER: ${{ github.repository_owner }}

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          # ~/.npm is a persistent runner volume (see setup-go note in test-go).

      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/openapi/go.mod
          # Go/npm caches are persistent volumes the runner mounts into every job
          # (deploy/provision/gitea/runner-config.yaml), so the tarball cache is off:
          # packing/unpacking ~250 MB per job costs more than it saves on this host.
          cache: false

      - name: Install pinned generators
        run: make api-install

      - name: Audit generator dependencies
        run: node scripts/audit-openapi-dependencies.cjs tools/openapi

      - name: Verify contracts and committed generated artifacts
        run: make api-check

      - name: Exercise registered handlers against contracts
        run: make api-contract-test

  test-frontend:
    name: Frontend tests
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.deploy_main != 'true' &&
      needs.detect-changes.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dexMonitor/react-frontend
    steps:
      - uses: actions/checkout@v7
      - name: Fetch submodules from the Gitea mirror
        working-directory: ${{ github.workspace }}
        run: |
          host="${REGISTRY_URL#*://}"; scheme="${REGISTRY_URL%%://*}"
          git config --global url."${scheme}://x-access-token:${REG_TOKEN}@${host}/${OWNER}/".insteadOf "https://github.com/kv055/"
          git submodule update --init --recursive
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REG_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          OWNER: ${{ github.repository_owner }}

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          # ~/.npm is a persistent runner volume (see setup-go note above).

      - run: npm ci

      - name: Verify generated API contracts
        run: npm run check:api-contract

      - name: Lint
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build

      - name: Run frontend unit tests
        # The Gitea runner is a 2-core i3 shared with the app stack: userEvent-heavy
        # tests (LiquidityWorkspace typing a BTC address) exceed vitest's 5 s default
        # there. GitHub keeps the default.
        run: npm test -- --testTimeout=30000

  certificate-renewal-test:
    name: Certificate renewal regression tests
    needs: [security, detect-changes]
    if: needs.detect-changes.outputs.deploy_main != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash deploy/test-letsencrypt.sh

  renovate:
    # Self-hosted Renovate for the Gitea root repo and the four service repos
    # (opens PRs on Gitea; the GitHub pipeline's renovate job covers GitHub).
    # A side branch of the pipeline: nothing needs it and it needs nothing, so
    # it never delays or gates tests, builds or deploys.
    #
    # Throttle: a "last checked" stamp in this runner's Actions cache; the job
    # only does work when the last successful run is >= 24h old (own stamp,
    # independent of GitHub's). develop only, so all runs share one cache
    # scope; Renovate runs on the first develop push/dispatch after the window.
    #
    # Shared logic: scripts/renovate-due.sh (throttle) and
    # scripts/renovate-run.sh (config merge, commons staging, docker run).
    # Repo names come from deploy/provision/manifest.sh, which is what
    # setup-gitea.sh created on this instance.
    #
    # actions/cache stays on v4 here: it is built on @actions/cache 4.x, the
    # same cache client setup-go@v6 already uses against act_runner's cache.
    name: Renovate (dependency updates)
    if: |
      (github.ref == 'refs/heads/develop' || github.ref_name == 'develop') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RENOVATE_IMAGE: ghcr.io/renovatebot/renovate:44.262.2
      RENOVATE_MIN_INTERVAL_SECONDS: "86400"
      STAMP_FILE: .renovate-last-run
    steps:
      - uses: actions/checkout@v7

      - name: Restore last-checked stamp
        uses: actions/cache/restore@v4
        with:
          path: .renovate-last-run
          # The exact key never exists; restore-keys yields the newest stamp.
          key: renovate-last-run-${{ github.run_id }}
          restore-keys: renovate-last-run-

      - name: Decide whether Renovate is due
        id: due
        run: bash scripts/renovate-due.sh check

      - name: Restore Renovate cache
        if: steps.due.outputs.due == 'true'
        uses: actions/cache@v4
        with:
          path: .renovate-cache
          key: renovate-cache-${{ github.run_id }}
          restore-keys: renovate-cache-

      - name: Run Renovate (Gitea repos)
        if: steps.due.outputs.due == 'true'
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          # Dedicated bot token if provisioned, else the Gitea admin token.
          RENOVATE_BOT_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          # github.com lookups (releases, changelogs) without anonymous limits.
          RENOVATE_GITHUB_COM_TOKEN: ${{ secrets.GH_PAT }}
          OWNER: ${{ github.repository_owner }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          # shellcheck source=/dev/null
          . deploy/provision/manifest.sh
          RENOVATE_REPOSITORIES=$(for entry in "${REPOS[@]}"; do printf '%s/%s\n' "$OWNER" "${entry%%|*}"; done | jq -R . | jq -sc .)
          echo "Repositories: $RENOVATE_REPOSITORIES"
          RENOVATE_TOKEN="${RENOVATE_BOT_TOKEN:-$REGISTRY_TOKEN}"
          export RENOVATE_REPOSITORIES RENOVATE_TOKEN
          export RENOVATE_PLATFORM=gitea
          export RENOVATE_ENDPOINT="${REGISTRY_URL%/}/api/v1/"
          export RENOVATE_OWNER="$OWNER"
          export RENOVATE_CACHE_DIR="$PWD/.renovate-cache"
          bash scripts/renovate-run.sh

      # Stamp only after a successful run: a failed run retries on the next
      # develop push instead of waiting out the 24h window.
      - name: Record last-checked stamp
        if: steps.due.outputs.due == 'true'
        run: bash scripts/renovate-due.sh stamp

      - name: Save last-checked stamp
        if: steps.due.outputs.due == 'true'
        uses: actions/cache/save@v4
        with:
          path: .renovate-last-run
          key: renovate-last-run-${{ github.run_id }}

  test-gate:
    name: Test gate
    needs: [database-sql-integrity, detect-changes, openapi, test-go, test-frontend, certificate-renewal-test, release-protocol]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful or intentionally skipped tests
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          RELEASE_RESULT: ${{ needs.release-protocol.result }}
          DATABASE_SQL_RESULT: ${{ needs.database-sql-integrity.result }}
          GO_RESULT: ${{ needs.test-go.result }}
          FRONTEND_RESULT: ${{ needs.test-frontend.result }}
          OPENAPI_RESULT: ${{ needs.openapi.result }}
          CERTIFICATE_RESULT: ${{ needs.certificate-renewal-test.result }}
        run: |
          set -Eeuo pipefail
          [ "$DATABASE_SQL_RESULT" = success ]
          [ "$DETECT_RESULT" = success ]
          [ "$RELEASE_RESULT" = success ]
          case "$OPENAPI_RESULT" in success|skipped) ;; *) exit 1;; esac
          case "$GO_RESULT" in success|skipped) ;; *) exit 1;; esac
          case "$FRONTEND_RESULT" in success|skipped) ;; *) exit 1;; esac
          case "$CERTIFICATE_RESULT" in success|skipped) ;; *) exit 1;; esac

  build-and-push:
    name: Build & push ${{ matrix.service }}
    needs: [detect-changes, test-gate]
    if: |
      needs.detect-changes.result == 'success' &&
      needs.test-gate.result == 'success'
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILD_SUMMARY: "false"
      # Authenticated Docker Hub pulls for the FROM base images (see the login
      # step below). Exposed as env because `secrets` is not usable in `if:`.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      fail-fast: false
      # Gitea act does not fan out fromJson(needs.*.outputs) matrices — keep a
      # static list and skip unchanged services per job.
      # NOTE: keep service/context/dockerfile in sync with
      # scripts/image-service-inputs.sh (GitHub CI resolves them at runtime
      # via image_service_build to avoid passing paths through job outputs).
      matrix:
        include:
          - service: tor
            context: ./dexUnifiedApi
            dockerfile: dexUnifiedApi/Dockerfile.tor
          - service: bitcoind-rpc-proxy
            context: deploy/bitcoind-rpc-proxy
            dockerfile: deploy/bitcoind-rpc-proxy/Dockerfile
          - service: bisq
            context: ./dexUnifiedApi
            dockerfile: dexUnifiedApi/Dockerfile.bisq
          - service: bisq2
            context: ./dexUnifiedApi
            dockerfile: dexUnifiedApi/Dockerfile.bisq2
          - service: unified-api
            context: .
            dockerfile: dexUnifiedApi/Dockerfile
          - service: unified-snapshot
            context: .
            dockerfile: dexUnifiedApi/Dockerfile.snapshot
          - service: postgres-backup
            context: .
            dockerfile: dexUnifiedApi/Dockerfile.backup
          - service: dexmonitor
            context: .
            dockerfile: dexMonitor/Dockerfile
          - service: mm-controller
            context: .
            dockerfile: dexTakerController/Dockerfile
          # totp-api disabled (see docker-compose.yml / services/totp-api/Dockerfile)
          - service: fiat-controller
            context: .
            dockerfile: dexFiatController/Dockerfile
    steps:
      - name: Check if this service needs building
        id: check
        env:
          CHANGES: ${{ needs.detect-changes.outputs.changes }}
          SERVICE: ${{ matrix.service }}
        run: |
          if case ",$CHANGES," in *",$SERVICE,"*) true;; *) false;; esac; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "$SERVICE changed -> building"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "$SERVICE unchanged -> skipping build"
          fi

      - uses: actions/checkout@v7
        if: steps.check.outputs.build == 'true'
      - name: Fetch submodules from the Gitea mirror
        if: steps.check.outputs.build == 'true'
        run: |
          host="${REGISTRY_URL#*://}"; scheme="${REGISTRY_URL%%://*}"
          git config --global url."${scheme}://x-access-token:${REG_TOKEN}@${host}/${OWNER}/".insteadOf "https://github.com/kv055/"
          git submodule update --init --recursive
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REG_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          OWNER: ${{ github.repository_owner }}

      - name: Resolve registry + build metadata
        if: steps.check.outputs.build == 'true'
        id: reg
        env:
          URL: ${{ secrets.REGISTRY_URL }}
          DEPLOY_MAIN: ${{ needs.detect-changes.outputs.deploy_main }}
        run: |
          gitea_host="${URL#*://}"; scheme="${URL%%://*}"
          echo "commit_hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "commit_date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

          if [ "$DEPLOY_MAIN" = "true" ]; then
            echo "registry=ghcr.io" >> "$GITHUB_OUTPUT"
            echo "image_owner=kv055" >> "$GITHUB_OUTPUT"
          else
            echo "registry=$gitea_host" >> "$GITHUB_OUTPUT"
            echo "image_owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
            if [ "$scheme" = "http" ]; then
              printf '[registry."%s"]\n  http = true\n  insecure = true\n' "$gitea_host" > /tmp/buildkitd.toml
            else
              printf '[registry."%s"]\n  insecure = true\n' "$gitea_host" > /tmp/buildkitd.toml
            fi
          fi

      - name: Prune orphaned buildx builders
        if: steps.check.outputs.build == 'true'
        run: |
          docker ps -a --filter "name=buildx_buildkit_" --format "{{.Names}}" \
            | grep -v "ci-builder0" \
            | xargs -r docker rm -f || true
          docker volume ls -q --filter "name=buildx_buildkit_" \
            | grep -v "ci-builder0" \
            | xargs -r docker volume rm || true

      - name: Create buildx builder (Gitea-registry aware)
        if: steps.check.outputs.build == 'true'
        env:
          URL: ${{ secrets.REGISTRY_URL }}
          DEPLOY_MAIN: ${{ needs.detect-changes.outputs.deploy_main }}
        run: |
          # Gitea act executes each step in a fresh job container. Build the
          # registry config here, immediately before Buildx consumes it; a
          # /tmp file created by the preceding metadata step does not persist.
          docker buildx use ci-builder 2>/dev/null && exit 0
          if [ "$DEPLOY_MAIN" = "true" ]; then
            docker buildx create --name ci-builder --use --driver docker-container
          else
            gitea_host="${URL#*://}"; scheme="${URL%%://*}"
            if [ "$scheme" = "http" ]; then
              printf '[registry."%s"]\n  http = true\n  insecure = true\n' "$gitea_host" > /tmp/buildkitd.toml
            else
              printf '[registry."%s"]\n  insecure = true\n' "$gitea_host" > /tmp/buildkitd.toml
            fi
            docker buildx create --name ci-builder --use --driver docker-container --config /tmp/buildkitd.toml
          fi

      - name: Login to Gitea registry
        if: steps.check.outputs.build == 'true' && steps.reg.outputs.registry != 'ghcr.io'
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.reg.outputs.registry }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Login to GHCR
        if: steps.check.outputs.build == 'true' && steps.reg.outputs.registry == 'ghcr.io'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: kv055
          password: ${{ secrets.GH_PAT }}

      # Base images come from Docker Hub. This runner shares the host's public
      # IP with local dev, so anonymous pulls compete for one per-IP quota;
      # logged-in pulls count against the account instead. Skipped (anonymous
      # fallback) when the secrets are absent.
      - name: Login to Docker Hub
        if: steps.check.outputs.build == 'true' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        id: image
        if: steps.check.outputs.build == 'true'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: |
            COMMIT_HASH=${{ steps.reg.outputs.commit_hash }}
            COMMIT_DATE=${{ steps.reg.outputs.commit_date }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.reg.outputs.registry }}/${{ steps.reg.outputs.image_owner }}/dexarbtrading-${{ matrix.service }}:latest
            ${{ steps.reg.outputs.registry }}/${{ steps.reg.outputs.image_owner }}/dexarbtrading-${{ matrix.service }}:${{ github.sha }}
          # Registry-backed layer cache (gha cache backend doesn't exist on Gitea).
          # Matters most for bisq/bisq2: without it every run rebuilds the Bisq
          # daemon from source (git clone + full gradle compile).
          cache-from: type=registry,ref=${{ steps.reg.outputs.registry }}/${{ steps.reg.outputs.image_owner }}/dexarbtrading-${{ matrix.service }}:buildcache
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref={0}/{1}/dexarbtrading-{2}:buildcache,mode=max', steps.reg.outputs.registry, steps.reg.outputs.image_owner, matrix.service) || '' }}

      - name: Record published image digest
        if: steps.check.outputs.build == 'true' && needs.detect-changes.outputs.deploy_main == 'true'
        env:
          SERVICE: ${{ matrix.service }}
          SHA: ${{ github.sha }}
          IMAGE: ${{ steps.reg.outputs.registry }}/${{ steps.reg.outputs.image_owner }}/dexarbtrading-${{ matrix.service }}@${{ steps.image.outputs.digest }}
        run: python3 scripts/release-images.py receipt --service "$SERVICE" --sha "$SHA" --image "$IMAGE" --output "receipts/$SERVICE.json"
      - uses: actions/upload-artifact@v3
        if: steps.check.outputs.build == 'true' && needs.detect-changes.outputs.deploy_main == 'true'
        with:
          name: image-receipt-${{ matrix.service }}
          path: receipts/${{ matrix.service }}.json
          if-no-files-found: error

  open-promote-pr:
    name: Open develop → main PR
    needs: [detect-changes, test-gate, build-and-push]
    if: |
      always() &&
      needs.detect-changes.outputs.deploy_main != 'true' &&
      needs.test-gate.result == 'success' &&
      (needs.build-and-push.result == 'success' || (needs.detect-changes.outputs.changes == '' && needs.build-and-push.result == 'skipped'))
    runs-on: ubuntu-latest
    steps:
      - name: Create or reuse promote PR
        env:
          TOKEN: ${{ github.token }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          existing=$(curl -fsS -H "Authorization: token ${TOKEN}" \
            "${API}/pulls?state=open&limit=50" \
            | jq -r '.[] | select(.base.ref == "main" and .head.ref == "develop") | .html_url' \
            | head -1) || existing=""

          if [ -n "$existing" ]; then
            echo "Open promote PR already exists: ${existing}"
            exit 0
          fi

          payload=$(jq -n \
            --arg sha "$SHA" \
            --arg run "$RUN_URL" \
            '{
              title: "Promote develop → main",
              head: "develop",
              base: "main",
              body: ("Develop CI is green for `" + $sha + "`. Merge this PR into `main` to promote.\n\nActions run: " + $run)
            }')

          resp=$(curl -fsS -X POST \
            -H "Authorization: token ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "${API}/pulls")

          echo "Opened promote PR: $(echo "$resp" | jq -r '.html_url')"

  pre-deploy:
    name: Pre-deploy checks
    needs: [detect-changes, test-gate, build-and-push]
    if: |
      always() &&
      needs.detect-changes.outputs.deploy_main == 'true' &&
      needs.test-gate.result == 'success' &&
      (needs.build-and-push.result == 'success' || (needs.detect-changes.outputs.changes == '' && needs.build-and-push.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: kv055
          password: ${{ secrets.GH_PAT }}

      - name: Verify changed image SHA tags exist in GHCR
        env:
          CHANGED_SERVICES: ${{ needs.detect-changes.outputs.changes }}
          SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          for svc in ${CHANGED_SERVICES//,/ }; do
            tag="ghcr.io/kv055/dexarbtrading-${svc}:${SHA}"
            echo "checking $tag"
            docker manifest inspect "$tag" >/dev/null
          done

      - name: Check out the VPS image-prune script
        uses: actions/checkout@v5
        with:
          sparse-checkout: deploy/prune-images.sh
          sparse-checkout-cone-mode: false

      - name: Install SSH key & known_hosts
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%b\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%b\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: VPS health checks
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          REPO_DIR: ${{ secrets.VPS_REPO_DIR }}
        run: |
          set -Eeuo pipefail
          ssh_opts=(-i ~/.ssh/id_ed25519 -o BatchMode=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o ConnectTimeout=10)
          # Before the disk guard. Keeps every container's image and the active and
          # previous releases' images, so exact rollback still works.
          ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" \
            "bash -s -- --repo-dir '$REPO_DIR'" < deploy/prune-images.sh
          ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" "REPO_DIR='$REPO_DIR' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          docker info >/dev/null
          docker compose version >/dev/null
          test -d "$REPO_DIR" || { echo "missing repo dir $REPO_DIR on VPS"; exit 1; }
          docker_root=$(docker info --format '{{.DockerRootDir}}' 2>/dev/null || echo /var/lib/docker)
          free_kb=$(df -P "$docker_root" | awk 'NR==2 {print $4}')
          [ "$free_kb" -gt 5242880 ] || { echo "low disk on $docker_root: $((free_kb/1024)) MB free, need >= 5120"; exit 1; }
          echo "health checks ok"
          REMOTE

  deploy:
    name: Deploy
    needs: [detect-changes, pre-deploy]
    if: |
      always() &&
      needs.detect-changes.outputs.deploy_main == 'true' &&
      needs.pre-deploy.result == 'success'
    runs-on: ubuntu-latest
    # ci-activate polls for up to 120m, plus staging and cleanup headroom.
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the commit pushed to the VPS repo carries every object the
          # VPS lacks (git's receive-pack connectivity check needs the ancestry).
          fetch-depth: 0
      - name: Fetch submodules from the Gitea mirror
        run: |
          host="${REGISTRY_URL#*://}"; scheme="${REGISTRY_URL%%://*}"
          git config --global url."${scheme}://x-access-token:${REG_TOKEN}@${host}/${OWNER}/".insteadOf "https://github.com/kv055/"
          git submodule update --init --recursive
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REG_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          OWNER: ${{ github.repository_owner }}

      - name: Install SSH key & known_hosts
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%b\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%b\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Download production baseline
        uses: actions/download-artifact@v3
        with:
          name: production-baseline
          path: release-artifacts
      - name: Download image build receipts
        if: needs.detect-changes.outputs.changes != ''
        uses: actions/download-artifact@v3
        with:
          path: release-downloads
      - name: Prepare receipt directory
        run: |
          mkdir -p release-artifacts/receipts
          if [ -d release-downloads ]; then
            find release-downloads -path '*/image-receipt-*/*.json' -exec cp {} release-artifacts/receipts/ \;
          fi
      - name: Validate and stage encrypted environment bundle
        timeout-minutes: 3
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          REPO_DIR: ${{ secrets.VPS_REPO_DIR }}
          NEW_SHA: ${{ github.sha }}
          RELEASE_ARTIFACTS: release-artifacts
          KEY_ROOT:            ${{ secrets.DOTENV_PRIVATE_KEY_ROOT }}
          KEY_UNIFIED_API:     ${{ secrets.DOTENV_PRIVATE_KEY_UNIFIED_API }}
          KEY_MONITOR:         ${{ secrets.DOTENV_PRIVATE_KEY_MONITOR }}
          KEY_MM_CONTROLLER:   ${{ secrets.DOTENV_PRIVATE_KEY_MM_CONTROLLER }}
          KEY_FIAT_CONTROLLER: ${{ secrets.DOTENV_PRIVATE_KEY_FIAT_CONTROLLER }}
        run: |
          set -Eeuo pipefail
          curl -sfS https://dotenvx.sh | sh
          bash deploy/ci-stage-env.sh "$NEW_SHA"

      - name: Push deploy commit into the VPS repo
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          REPO_DIR: ${{ secrets.VPS_REPO_DIR }}
          NEW_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          # GitHub Actions is disabled on this repo (billing), so the VPS cannot pull this
          # commit from GitHub. Deliver the exact built commit straight from the runner's
          # checkout into the VPS git repo over the existing SSH channel; the remote
          # sync_tree then checks it out locally with no GitHub dependency. Pushed to a
          # per-SHA ref under refs/deploy/* (never a checked-out branch, so receive-pack's
          # denyCurrentBranch can't reject it) — this also keeps the previous deploy's
          # commit reachable for the auto-rollback path.
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/id_ed25519 -o BatchMode=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o ConnectTimeout=10" \
            git push --force "ssh://$SSH_USER@$SSH_HOST$REPO_DIR" "HEAD:refs/deploy/$NEW_SHA"

      - name: Activate staged release transactionally
        timeout-minutes: 130
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          REPO_DIR: ${{ secrets.VPS_REPO_DIR }}
          GHCR_TOKEN: ${{ secrets.GH_PAT }}
          GHCR_USER: kv055
          NEW_SHA: ${{ github.sha }}
          CHANGED_SERVICES: ${{ needs.detect-changes.outputs.changes }}
          FETCH_ORIGIN: "false"
        run: bash deploy/ci-activate.sh

      - name: Remove staged plaintext environment
        if: always()
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          REPO_DIR: ${{ secrets.VPS_REPO_DIR }}
          NEW_SHA: ${{ github.sha }}
        run: bash deploy/ci-cleanup-staging.sh
