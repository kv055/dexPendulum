  # TOTP API is disabled for now.
  # totp-api:
  #   logging: *default-logging
  #   image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-kv055}/dexarbtrading-totp-api:${TOTP_API_IMAGE_TAG:-${IMAGE_TAG:-latest}}
  #   environment:
  #     - PORT=8080
  #     - API_KEY=${TOTP_API_KEY:-}
  #   healthcheck:
  #     test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 5s
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 64M
  #         cpus: '0.25'
