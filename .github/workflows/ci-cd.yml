# develop: test + build (validate images) + open develop→main PR
# main:    skip tests; build (push images to GHCR) + pre-deploy + deploy to VPS
name: CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - '.codex'
      - '.agents/**'
      - 'deploy/provision/**'
      - 'dexTakerController/docs/**'
      - 'dexMonitor/docs/**'
      - 'dexUnifiedApi/docs/**'
      - 'dexMmTradingLogicHummingBot/**'
      - '.gitignore'
      - 'LICENSE'
  # No `main` here on purpose: the auto-opened develop → main promote PR
  # must not start a second run (the push run already tested that SHA).
  # Feature PRs targeting develop still get CI.
  pull_request:
    branches: [develop]
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - '.codex'
      - '.agents/**'
      - 'deploy/provision/**'
      - 'dexTakerController/docs/**'
      - 'dexMonitor/docs/**'
      - 'dexUnifiedApi/docs/**'
      - 'dexMmTradingLogicHummingBot/**'
      - '.gitignore'
      - 'LICENSE'

permissions:
  contents: read
  packages: write

# Per-branch serialization: keeps the single-VPS deploy (main) from overlapping
# itself, while a long develop/staging validation never queues ahead of a prod deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Release tag (v-prefixed) + SHA-256 of its linux_x64 tarball; Renovate bumps
  # both together (github-release-attachments computes the new digest).
  GITLEAKS_VERSION: v8.30.1
  GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  security:
    name: Secret protection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Validate encrypted environment contract
        run: bash scripts/validate-env-contract.sh keys

      - name: Install Gitleaks
        run: |
          set -Eeuo pipefail
          install_dir=$(mktemp -d)
          trap 'rm -rf "$install_dir"' EXIT
          archive="$install_dir/gitleaks.tar.gz"
          bin_dir="${RUNNER_TEMP:-$HOME/.local}/gitleaks-${GITLEAKS_VERSION}"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" -o "$archive"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum -c -
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$install_dir" gitleaks
          install "$install_dir/gitleaks" "$bin_dir/gitleaks"
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"

      - name: Reject plaintext dotenv files
        run: |
          set -Eeuo pipefail
          offending=()
          while IFS= read -r -d '' path; do
            basename=${path##*/}
            case "$basename" in
              .env|.env.*)
                case "$basename" in
                  *.enc|*.example) ;;
                  *) offending+=("$path") ;;
                esac
                ;;
            esac
          done < <(find . -type d -name .git -prune -o -type f \( -name '.env' -o -name '.env.*' \) -print0)
          if ((${#offending[@]})); then
            printf 'ERROR: plaintext dotenv files are forbidden in the checkout:\n' >&2
            printf '  %s\n' "${offending[@]}" >&2
            exit 1
          fi

      - name: Scan root and submodule snapshot
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner

  database-sql-integrity:
    name: Database SQL immutability
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Reject changed database SQL history
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "Manual run has no change range; skipping database SQL immutability check."
            exit 0
          fi
          if [ "$EVENT" = pull_request ]; then base="$PR_BASE"; head="$PR_HEAD"; else base="$BEFORE"; head="$AFTER"; fi
          if [ -z "$base" ] || [ "$base" = "$zero" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base=$(git rev-parse "${head}^" 2>/dev/null || true)
          fi
          [ -n "$base" ] || { echo "No usable base commit; refusing to skip database SQL immutability check." >&2; exit 1; }
          old=$(git ls-tree "$base" dexUnifiedApi | awk '{print $3}')
          new=$(git ls-tree "$head" dexUnifiedApi | awk '{print $3}')
          [ -n "$old" ] && [ -n "$new" ] || { echo "Unable to resolve dexUnifiedApi submodule revisions." >&2; exit 1; }
          [ "$old" != "$new" ] || { echo "dexUnifiedApi submodule is unchanged."; exit 0; }
          # SQL immutability was introduced with this dexUnifiedApi revision.
          # Older target branches may include the pre-policy schema squash in
          # their PR diff, so begin enforcement at the known-good boundary.
          sql_history_baseline=12fbf354ed04922471acafd6af1f017a7402c611
          git -C dexUnifiedApi fetch --no-tags origin "$old" "$new" "$sql_history_baseline"
          git -C dexUnifiedApi fetch --no-tags origin main || true
          if git -C dexUnifiedApi merge-base --is-ancestor "$old" "$sql_history_baseline" \
            && git -C dexUnifiedApi merge-base --is-ancestor "$sql_history_baseline" "$new"; then
            echo "Using SQL immutability baseline $sql_history_baseline (target revision $old predates enforcement)."
            old="$sql_history_baseline"
          fi

          violations=()
          while IFS=$'\t' read -r status first second; do
            [ -n "$status" ] || continue
            if [ "${status:0:1}" = A ] && [[ "$first" == db/migrations/*.sql ]] \
              && [[ "${first##*/}" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
              echo "allowed new migration: $first"
              continue
            fi
            if [ "$status" = M ] && [[ "$first" == db/schema/* ]]; then
              new_blob=$(git -C dexUnifiedApi rev-parse "$new:$first")
              restored=0
              while IFS= read -r c; do
                [ -n "$c" ] || continue
                git -C dexUnifiedApi cat-file -e "$c:$first" 2>/dev/null || continue
                if [ "$(git -C dexUnifiedApi rev-parse "$c:$first")" = "$new_blob" ]; then
                  restored=1
                  break
                fi
              done < <(git -C dexUnifiedApi log --pretty=%H "$old" -- "$first")
              if [ "$restored" = 1 ]; then
                echo "allowed historical restore: $first"
                continue
              fi
            fi
            violations+=("$status $first${second:+ -> $second}")
          done < <(git -C dexUnifiedApi diff --name-status --find-renames "$old" "$new" -- db/schema db/migrations)

          if ((${#violations[@]})); then
            printf 'ERROR: existing database SQL is immutable. Add only new timestamped migrations under db/migrations/.\n' >&2
            printf '  %s\n' "${violations[@]}" >&2
            exit 1
          fi

  detect-changes:
    # Diff the push/PR range and decide which tests and image builds run.
    name: Detect changed services
    needs: security
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.detect.outputs.changes }}
      test_modules: ${{ steps.detect.outputs.test_modules }}
      test_modules_json: ${{ steps.detect.outputs.test_modules_json }}
      run_frontend: ${{ steps.detect.outputs.run_frontend }}
      build_services_json: ${{ steps.detect.outputs.build_services_json }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so both ends of the compared range are present (a push can
          # carry several commits; a PR's base/head are parents of the merge commit).
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GH_PAT }}
      - name: Read production image baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          REPO_DIR: ${{ secrets.VPS_REPO_DIR }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%b\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%b\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          python3 scripts/release-images.py ci-baseline --output release-artifacts/baseline.json
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: production-baseline
          path: release-artifacts/baseline.json
          if-no-files-found: error
      - name: Determine changed services
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          REF: ${{ github.ref }}
          BASELINE_FILE: release-artifacts/baseline.json
        run: bash scripts/detect-changed-services.sh

  release-protocol:
    name: Image detection and deployment regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          set -Eeuo pipefail
          bash scripts/test-image-service-inputs.sh
          bash scripts/test-bisq-pins.sh
          python3 scripts/test-release-images.py
          bash deploy/test-transactional-deploy.sh
          DEPLOY_TEST_DIGEST=1 bash deploy/test-transactional-deploy.sh
          bash deploy/test-ci-activate.sh

  test-go:
    name: Go tests (${{ matrix.module }})
    needs: detect-changes
    if: |
      (github.event_name != 'push' || github.ref != 'refs/heads/main') &&
      needs.detect-changes.outputs.test_modules != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.test_modules_json) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: go test ./...

  bisq-patches-apply:
    # Fast guard (seconds, not the full image build): prove the bisq source
    # patches still apply against the pinned BISQ_COMMIT. A version bump that
    # refactors the patched files fails here immediately instead of deep inside
    # the slow from-source image build.
    name: Bisq patches apply cleanly
    needs: detect-changes
    if: |
      (github.event_name != 'push' || github.ref != 'refs/heads/main') &&
      contains(needs.detect-changes.outputs.changes, 'bisq')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Clone pinned bisq and apply patches
        run: |
          set -Eeuo pipefail
          # Fail closed on a missing/malformed pin or a floating-tag clone
          # (Gitea run #348); verifies exactly what the image builds.
          eval "$(bash "$GITHUB_WORKSPACE/scripts/bisq-pin-args.sh" \
            "$GITHUB_WORKSPACE/dexUnifiedApi/Dockerfile.bisq")"
          echo "Checking patches against bisq v${BISQ_VERSION} @ ${BISQ_COMMIT}"
          # Fetch the pinned commit — never the floating tag — so the check
          # verifies exactly what the image builds (a tag re-cut must not
          # slip past this job).
          git init -q /tmp/bisq
          git -C /tmp/bisq remote add origin https://github.com/bisq-network/bisq.git
          git -C /tmp/bisq fetch --depth 1 origin "$BISQ_COMMIT"
          git -C /tmp/bisq checkout -q --detach FETCH_HEAD
          git -C /tmp/bisq submodule update --init --recursive --depth 1
          for p in "$GITHUB_WORKSPACE"/dexUnifiedApi/bisq-patches/*.patch; do
            echo "applying $(basename "$p")"
            git -C /tmp/bisq apply --3way "$p"
          done
          echo "All patches apply cleanly against v${BISQ_VERSION} @ ${BISQ_COMMIT}."

  compose-validate:
    name: Compose topology validation
    needs: detect-changes
    # Cheap (docker compose config + grep) and secret-free: the script
    # materializes empty .env placeholders for any missing env_file, so it
    # works on a fresh checkout. Run on every PR to catch network-mode and
    # service-wiring regressions even when no application image needs building.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose topology
        run: bash scripts/compose-validate.sh

      - name: Validate Grafana dashboards
        # uid changes on an already-provisioned dashboard file silently freeze
        # the live copy (Grafana cannot re-key it), so compare against the base.
        run: |
          git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF}"
          python3 scripts/validate-grafana-dashboards.py --base FETCH_HEAD

  openapi:
    name: OpenAPI source-of-truth check
    needs: security
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            tools/openapi/package-lock.json
            dexMonitor/react-frontend/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/openapi/go.mod
          cache-dependency-path: tools/openapi/go.sum

      - name: Install pinned generators
        run: make api-install

      - name: Audit generator dependencies
        run: node scripts/audit-openapi-dependencies.cjs tools/openapi

      - name: Verify contracts and committed generated artifacts
        run: make api-check

      - name: Exercise registered handlers against contracts
        run: make api-contract-test

  test-frontend:
    name: Frontend tests
    needs: detect-changes
    if: |
      (github.event_name != 'push' || github.ref != 'refs/heads/main') &&
      needs.detect-changes.outputs.run_frontend == 'true'
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.59 cannot
    # install chromium on. Return to ubuntu-latest once Playwright supports it.
    # (renovate.json keeps Renovate from bumping this pin.)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dexMonitor/react-frontend
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: dexMonitor/react-frontend/package-lock.json

      - run: npm ci

      - name: Verify generated API contracts
        run: npm run check:api-contract

      - name: Lint
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build

      - name: Run frontend unit tests
        run: npm test

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('dexMonitor/react-frontend/package-lock.json') }}

      - name: Install Playwright browsers + deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # The browser download intermittently stalls with no internal timeout, which
        # hung this job for hours before. Bound each attempt and retry; re-running the
        # apt portion is cheap since the system deps are already installed.
        run: |
          for i in 1 2 3; do
            timeout 300 npx playwright install --with-deps chromium && exit 0
            echo "::warning::playwright install attempt $i stalled/failed; retrying"
          done
          exit 1

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: dexMonitor/react-frontend/playwright-report/
          retention-days: 7

  certificate-renewal-test:
    name: Certificate renewal regression tests
    needs: security
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash deploy/test-letsencrypt.sh

  renovate:
    # Self-hosted Renovate for the GitHub root repo and the four service repos, run as
    # a side branch of the pipeline: nothing needs it and it needs nothing, so
    # it never delays or gates tests, builds or deploys. Policy lives in
    # renovate/shared.json (applied to every repo by the bot); bot settings
    # (repo list, auth, binaries) in renovate/global.json.
    #
    # Throttle: a "last checked" stamp (epoch seconds) is carried in the
    # Actions cache; the job only does work when the last successful run is
    # >= 24h old. Only develop runs it, so every run shares one cache scope
    # (main/PR runs could not see develop's stamp). Renovate therefore runs on
    # the first develop push/dispatch after the 24h window, not on a timer.
    #
    # Run logic (config merge, staging commons for the services'
    # `replace commons => ../commons`, docker run) is scripts/renovate-run.sh,
    # shared with the Gitea pipeline's renovate job.
    name: Renovate (dependency updates)
    # GitHub repos only; the Gitea pipeline (.gitea/workflows/ci.yml) has its
    # own renovate job that targets the Gitea repos.
    if: |
      github.server_url == 'https://github.com' &&
      github.ref == 'refs/heads/develop' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RENOVATE_IMAGE: ghcr.io/renovatebot/renovate:44.257.9
      RENOVATE_MIN_INTERVAL_SECONDS: "86400"
      STAMP_FILE: .renovate-last-run
    steps:
      # The stamp check needs scripts/, so checkout comes first (cheap, no
      # submodules).
      - uses: actions/checkout@v7

      - name: Restore last-checked stamp
        uses: actions/cache/restore@v6
        with:
          path: .renovate-last-run
          # The exact key never exists; restore-keys yields the newest stamp.
          key: renovate-last-run-${{ github.run_id }}
          restore-keys: renovate-last-run-

      - name: Decide whether Renovate is due
        id: due
        run: bash scripts/renovate-due.sh check

      - name: Restore Renovate cache
        if: steps.due.outputs.due == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/renovate-cache
          key: renovate-cache-${{ github.run_id }}
          restore-keys: renovate-cache-

      - name: Run Renovate (GitHub repos)
        if: steps.due.outputs.due == 'true'
        env:
          RENOVATE_TOKEN: ${{ secrets.GH_PAT }}
          RENOVATE_PLATFORM: github
          RENOVATE_OWNER: kv055
          RENOVATE_CACHE_DIR: ${{ runner.temp }}/renovate-cache
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash scripts/renovate-run.sh

      # Stamp only after a successful run: a failed run retries on the next
      # develop push instead of waiting out the 24h window.
      - name: Record last-checked stamp
        if: steps.due.outputs.due == 'true'
        run: bash scripts/renovate-due.sh stamp

      - name: Save last-checked stamp
        if: steps.due.outputs.due == 'true'
        uses: actions/cache/save@v6
        with:
          path: .renovate-last-run
          key: renovate-last-run-${{ github.run_id }}

  test-gate:
    name: Test gate
    needs: [database-sql-integrity, detect-changes, openapi, test-go, test-frontend, certificate-renewal-test, release-protocol]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful or intentionally skipped tests
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          RELEASE_RESULT: ${{ needs.release-protocol.result }}
          DATABASE_SQL_RESULT: ${{ needs.database-sql-integrity.result }}
          GO_RESULT: ${{ needs.test-go.result }}
          FRONTEND_RESULT: ${{ needs.test-frontend.result }}
          OPENAPI_RESULT: ${{ needs.openapi.result }}
          CERTIFICATE_RESULT: ${{ needs.certificate-renewal-test.result }}
        run: |
          set -Eeuo pipefail
          [ "$DATABASE_SQL_RESULT" = success ]
          [ "$DETECT_RESULT" = success ]
          [ "$RELEASE_RESULT" = success ]
          case "$OPENAPI_RESULT" in success|skipped) ;; *) exit 1;; esac
          case "$GO_RESULT" in success|skipped) ;; *) exit 1;; esac
          case "$FRONTEND_RESULT" in success|skipped) ;; *) exit 1;; esac
          case "$CERTIFICATE_RESULT" in success|skipped) ;; *) exit 1;; esac

  build-and-push:
    name: Build & push ${{ matrix.service }}
    needs: [detect-changes, test-gate]
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.test-gate.result == 'success' &&
      needs.detect-changes.outputs.changes != '' &&
      needs.detect-changes.outputs.build_services_json != '' &&
      needs.detect-changes.outputs.build_services_json != '[]'
    # Runs on both push (build + push) and pull_request (build-only validation, see the
    # 'push:' flag below) so a bad image — e.g. an auto bisq bump — is caught before merge.
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILD_SUMMARY: false
      # Authenticated Docker Hub pulls for the FROM base images (see the login
      # step below). Exposed as env because `secrets` is not usable in `if:`.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        # Service names only (no context/dockerfile paths): paths such as
        # deploy/bitcoind-rpc-proxy can match a secret substring and GitHub
        # then drops the whole output ("Skip output ... since it may contain
        # secret"). Context/dockerfile are resolved at runtime (see below).
        service: ${{ fromJson(needs.detect-changes.outputs.build_services_json) }}
    steps:
      - name: Compute lowercase image owner
        id: owner
        run: |
          echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Resolve build inputs
        id: resolve
        run: |
          set -Eeuo pipefail
          source scripts/image-service-inputs.sh
          read -r CONTEXT DOCKERFILE < <(image_service_build "${{ matrix.service }}")
          [[ -n "${DOCKERFILE:-}" ]] || { echo "unknown service ${{ matrix.service }}" >&2; exit 1; }
          echo "context=${CONTEXT}" >> "$GITHUB_OUTPUT"
          echo "dockerfile=${DOCKERFILE}" >> "$GITHUB_OUTPUT"

      - name: Compute build metadata
        id: meta
        run: |
          echo "commit_hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "commit_date=$(git log -1 --format=%cI)"   >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Base images come from Docker Hub; logged-in pulls count against the
      # account's limit instead of the runner IP's anonymous one. Skipped when
      # the secrets are absent (e.g. fork PRs), which falls back to anonymous.
      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        id: image
        with:
          context: ${{ steps.resolve.outputs.context }}
          file: ${{ steps.resolve.outputs.dockerfile }}
          # Frontend "deployed commit" header values; only the dexmonitor image
          # consumes them, the rest emit a harmless "unused build args" buildx warning.
          build-args: |
            COMMIT_HASH=${{ steps.meta.outputs.commit_hash }}
            COMMIT_DATE=${{ steps.meta.outputs.commit_date }}
          # Push only on merges to main; PRs build for validation but never publish/deploy.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/dexarbtrading-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/dexarbtrading-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Record published image digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SERVICE: ${{ matrix.service }}
          SHA: ${{ github.sha }}
          IMAGE: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/dexarbtrading-${{ matrix.service }}@${{ steps.image.outputs.digest }}
        run: python3 scripts/release-images.py receipt --service "$SERVICE" --sha "$SHA" --image "$IMAGE" --output "receipts/$SERVICE.json"
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: image-receipt-${{ matrix.service }}
          path: receipts/${{ matrix.service }}.json
          if-no-files-found: error

  build-report:
    name: Build report
    needs: build-and-push
    if: always() && needs.build-and-push.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Write consolidated summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Docker Build Summary"
            echo ""
            echo "| Service | Status | Duration |"
            echo "|---------|:------:|:--------:|"
            gh api "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
              --paginate --jq '
                .jobs[]
                | select(.name | startswith("Build & push "))
                | {
                    svc:        (.name | ltrimstr("Build & push ")),
                    conclusion: .conclusion,
                    duration: (
                      if .started_at and .completed_at then
                        ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) | "\(.)s"
                      else "—" end
                    )
                  }
                | "| \(.svc) | \(if .conclusion == "success" then "✅ success" elif .conclusion == "failure" then "❌ failure" elif .conclusion == null then "🔄 running" else "⚠️ \(.conclusion)" end) | \(.duration) |"
              '
            echo ""
            echo "_Run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_"
          } >> "$GITHUB_STEP_SUMMARY"

  open-promote-pr:
    name: Open develop → main PR
    needs: [detect-changes, test-gate, build-and-push]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      needs.test-gate.result == 'success' &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create or reuse promote PR
        env:
          # GITHUB_TOKEN cannot create PRs unless the repo setting
          # "Allow GitHub Actions to create and approve pull requests" is on;
          # GH_PAT is the same pattern as bisq-version-bump.
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          existing=$(gh pr list --repo "$REPO" --base main --head develop --state open --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then
            echo "Open promote PR already exists: ${existing}"
            exit 0
          fi

          body=$(printf 'Develop CI is green for `%s`. Merge this PR into `main` to promote.\n\nActions run: %s' "$SHA" "$RUN_URL")
          url=$(gh pr create \
            --repo "$REPO" \
            --base main \
            --head develop \
            --title "Promote develop → main" \
            --body "$body")
          echo "Opened promote PR: ${url}"

  pre-deploy:
    name: Pre-deploy checks
    needs: [detect-changes, test-gate, build-and-push]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.test-gate.result == 'success' &&
      (needs.build-and-push.result == 'success' || (needs.detect-changes.outputs.changes == '' && needs.build-and-push.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compute lowercase image owner
        id: owner
        run: |
          echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify changed image SHA tags exist in GHCR
        env:
          CHANGED_SERVICES: ${{ needs.detect-changes.outputs.changes }}
          OWNER: ${{ steps.owner.outputs.value }}
          SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          for svc in ${CHANGED_SERVICES//,/ }; do
            tag="${REGISTRY}/${OWNER}/dexarbtrading-${svc}:${SHA}"
            echo "checking $tag"
            docker manifest inspect "$tag" >/dev/null
          done

      - name: Install SSH key & known_hosts
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%b\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%b\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: VPS health checks
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          REPO_DIR: ${{ secrets.VPS_REPO_DIR }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" "REPO_DIR='$REPO_DIR' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          docker info >/dev/null
          docker compose version >/dev/null
          test -d "$REPO_DIR" || { echo "missing repo dir $REPO_DIR on VPS"; exit 1; }
          echo "Docker disk usage before unused-image prune:"
          docker system df
          # Active and previous release images are retained for exact rollback.
          echo "Docker disk usage after unused-image prune:"
          docker system df
          docker_root=$(docker info --format '{{.DockerRootDir}}' 2>/dev/null || echo /var/lib/docker)
          free_kb=$(df -P "$docker_root" | awk 'NR==2 {print $4}')
          [ "$free_kb" -gt 5242880 ] || { echo "low disk on $docker_root: $((free_kb/1024)) MB free, need >= 5120"; exit 1; }
          echo "health checks ok"
          REMOTE

  deploy:
    name: Deploy
    needs: [detect-changes, pre-deploy]
    # always() is required: skipped main test jobs make the default success()
    # gate false even when pre-deploy itself succeeded (see Gitea deploy if).
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.pre-deploy.result == 'success'
    runs-on: ubuntu-latest
    # ci-activate polls for up to 120m, plus staging and cleanup headroom.
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Install SSH key & known_hosts
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%b\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%b\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Download production baseline
        uses: actions/download-artifact@v8
        with:
          name: production-baseline
          path: release-artifacts
      - name: Download image build receipts
        if: needs.detect-changes.outputs.changes != ''
        uses: actions/download-artifact@v8
        with:
          pattern: image-receipt-*
          path: release-artifacts/receipts
          merge-multiple: true
      - name: Prepare receipt directory
        run: |
          mkdir -p release-artifacts/receipts
      - name: Validate and stage encrypted environment bundle
        timeout-minutes: 3
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          REPO_DIR: ${{ secrets.VPS_REPO_DIR }}
          NEW_SHA: ${{ github.sha }}
          RELEASE_ARTIFACTS: release-artifacts
          KEY_ROOT:            ${{ secrets.DOTENV_PRIVATE_KEY_ROOT }}
          KEY_UNIFIED_API:     ${{ secrets.DOTENV_PRIVATE_KEY_UNIFIED_API }}
          KEY_MONITOR:         ${{ secrets.DOTENV_PRIVATE_KEY_MONITOR }}
          KEY_MM_CONTROLLER:   ${{ secrets.DOTENV_PRIVATE_KEY_MM_CONTROLLER }}
          KEY_FIAT_CONTROLLER: ${{ secrets.DOTENV_PRIVATE_KEY_FIAT_CONTROLLER }}
        run: |
          set -Eeuo pipefail
          curl -sfS https://dotenvx.sh | sh
          bash deploy/ci-stage-env.sh "$NEW_SHA"

      - name: Activate staged release transactionally
        timeout-minutes: 130
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          REPO_DIR: ${{ secrets.VPS_REPO_DIR }}
          GHCR_TOKEN: ${{ secrets.GH_PAT }}
          GHCR_USER: ${{ github.actor }}
          NEW_SHA: ${{ github.sha }}
          CHANGED_SERVICES: ${{ needs.detect-changes.outputs.changes }}
          FETCH_ORIGIN: "true"
        # Detached VPS activate + result polling so a hung SSH pipe cannot
        # false-fail CI after a successful transactional deploy.
        run: bash deploy/ci-activate.sh

      - name: Remove staged plaintext environment
        if: always()
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          REPO_DIR: ${{ secrets.VPS_REPO_DIR }}
          NEW_SHA: ${{ github.sha }}
        run: bash deploy/ci-cleanup-staging.sh
