# Runtime stack: image-only, no `build:` keys (scripts/compose-validate.sh
# enforces this). This file alone is what production and the end-user release
# run. Building from local source lives in docker-compose.override.yml, which
# Compose merges automatically on a plain `docker compose ...` in this directory.
#
# Pin the compose project name so named-volume prefixes (e.g. postgres-data)
# stay stable regardless of which directory `docker compose up` is run from.
# Without this, running compose from a worktree dir mints brand-new empty
# volumes under a different project prefix and the real data looks "wiped".
name: dexarbtrading

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    logging: *default-logging
    image: postgres:17-alpine
    ports:
      # Bind to loopback only: reachable from the VPS host (so the DBeaver SSH
      # tunnel can forward to it) and from the docker network (services use the
      # postgres:5432 DNS name), but never exposed on the public interface.
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_ADMIN_USER}
      - POSTGRES_PASSWORD=${POSTGRES_ADMIN_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          # 256M OOM-killed under shared-buffer + shmem pressure on the VPS;
          # 384M gives headroom without reclaiming the Bisq budget.
          memory: 384M
          cpus: '0.5'
    restart: unless-stopped

  tor:
    logging: *default-logging
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-kv055}/dexarbtrading-tor:${TOR_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    ports:
      # Loopback only, for host-side debugging / curl --socks5 tests. Sibling
      # containers on the bridge network use tor:9050 directly. Override
      # TOR_SOCKS_HOST_PORT when the host already runs its own tor daemon on
      # 9050.
      - "127.0.0.1:${TOR_SOCKS_HOST_PORT:-9050}:9050"
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "curl", "-sf", "--socks5", "127.0.0.1:9050", "http://example.com"]
      interval: 10s
      timeout: 5s
      retries: 10
      # Cold bootstrap after a recreate has no cached consensus; 2 minutes
      # was enough to mark a live Tor daemon unhealthy during deploy.
      start_period: 480s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    restart: unless-stopped

  # LND's bitcoind RPC client resolves its host before dialing, so it cannot
  # consume a .onion hostname directly. This bridge presents a Docker-local TCP
  # endpoint and delegates onion resolution and transport to Tor via SOCKS5.
  bitcoind-rpc-proxy:
    logging: *default-logging
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-kv055}/dexarbtrading-bitcoind-rpc-proxy:${BITCOIND_RPC_PROXY_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    depends_on:
      tor:
        condition: service_healthy
    environment:
      - UPSTREAM_URL=http://${LND_BITCOIND_RPCHOST}:${LND_BITCOIND_RPCPORT:-8332}/
      - TOR_SOCKS_ADDR=tor:9050
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8332/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  bisq:
    logging: *default-logging
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-kv055}/dexarbtrading-bisq:${BISQ_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    depends_on:
      tor:
        condition: service_healthy
      postgres:
        condition: service_healthy
      unified-api:
        condition: service_healthy
    environment:
      - BISQ_VERSION=1.10.11
      - BISQ_ACCOUNT_PROVIDER=Bisq
      - BISQ_ACCOUNT_FILE_PATH=${BISQ_ACCOUNT_FILE_PATH:-}
      - BISQ_BACKUP_DATABASE_URL=postgres://dex_unified_api:${POSTGRES_UNIFIED_API_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - BISQ_SEED_BACKUP_DATABASE_URL=postgres://dex_unified_api:${POSTGRES_UNIFIED_API_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - BISQ_WALLET_PASSWORD=${BISQ_WALLET_PASSWORD:-}
      # gRPC --apiPassword for :9998; must match the BISQ_API_PASSWORD the
      # client services (unified-api, snapshot, dexmonitor, mm-controller) send.
      - BISQ_API_PASSWORD=${BISQ_API_PASSWORD:-}
    volumes:
      - bisq-data:/home/appuser/.local/share/Bisq
      # Optional bring-your-own Bisq account file:
      # - ./dexUnifiedApi/bisqseed/secrets/UserPayload:/run/secrets/bisq_UserPayload:ro
      # Set BISQ_ACCOUNT_FILE_PATH=/run/secrets/bisq_UserPayload when using that mount.
    deploy:
      resources:
        limits:
          memory: 3072M
          cpus: '1.5'
    restart: unless-stopped

  bisq2:
    logging: *default-logging
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-kv055}/dexarbtrading-bisq2:${BISQ2_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    depends_on:
      tor:
        condition: service_healthy
      postgres:
        condition: service_healthy
      unified-api:
        condition: service_healthy
    environment:
      - BISQ2_VERSION=2.1.15
      - BISQ2_ACCOUNT_FILE_PATH=${BISQ2_ACCOUNT_FILE_PATH:-}
      - BISQ2_BACKUP_DATABASE_URL=postgres://dex_unified_api:${POSTGRES_UNIFIED_API_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - BISQ2_SEED_BACKUP_DATABASE_URL=postgres://dex_unified_api:${POSTGRES_UNIFIED_API_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - BISQ2_WALLET_PASSWORD=${BISQ2_WALLET_PASSWORD:-}
    volumes:
      - bisq2-data:/home/appuser/.local/share/Bisq2
      # Optional bring-your-own Bisq 2 account file (format TBD):
      # - ./dexUnifiedApi/bisqseed/secrets/bisq2_account:/run/secrets/bisq2_account:ro
      # Set BISQ2_ACCOUNT_FILE_PATH=/run/secrets/bisq2_account when using that mount.
    ports:
      # Loopback only: host-side dev tooling / curl reaches the REST API.
      # Sibling containers use http://bisq2:8090, not this publish. The API has
      # no static-password auth (only device-pairing; bisq2-startup.sh turns
      # authorization and session handling off), so it must never be published
      # on a public interface.
      - "127.0.0.1:8090:8090"
    deploy:
      resources:
        limits:
          memory: 3072M
          cpus: '1.5'
    restart: unless-stopped

  unified-api:
    logging: *default-logging
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-kv055}/dexarbtrading-unified-api:${UNIFIED_API_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    depends_on:
      postgres:
        condition: service_healthy
      tor:
        condition: service_healthy
    env_file:
      - ./dexUnifiedApi/.env
    ports:
      # Bind to loopback only: previously published on 0.0.0.0, which exposed
      # /internal/*, /metrics and the raw API to the public internet (bypassing
      # nginx). Loopback keeps it off the public interface while still letting the
      # local Vite dev server (vite.config.ts proxies to localhost:5010) reach it.
      # In prod nothing uses this mapping (services use the unified-api:5010 DNS
      # name); it is harmless there because loopback is not externally reachable.
      - "127.0.0.1:5010:5010"
    environment:
      - POSTGRES_HOST=postgres
      - LISTEN_ADDR=:5010
      - MM_CONTROLLER_API_URL=http://mm-controller:5001
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}
      # The internal ingest endpoints fail CLOSED when INTERNAL_API_SECRET is
      # empty. Set ALLOW_INSECURE_INTERNAL=true to intentionally run them open
      # (e.g. before a secret is provisioned); default empty = secure.
      - ALLOW_INSECURE_INTERNAL=${ALLOW_INSECURE_INTERNAL:-}
      - TOR_PROXY_ADDR=tor:9050
      - BISQ_GRPC_HOST=bisq:9998
      - BISQ_API_PASSWORD=${BISQ_API_PASSWORD:-}
      - BISQ2_REST_HOST=bisq2:8090
      - BISQ2_API_PASSWORD=${BISQ2_API_PASSWORD:-}
      - ACCOUNT_HEALTH_INTERVAL=${ACCOUNT_HEALTH_INTERVAL:-10m}
      - MM_CEX_CAPABILITY_MAX_AGE=${MM_CEX_CAPABILITY_MAX_AGE:-30m}
      - COINBASE_WITHDRAW_RESERVE_FLOOR_SAT=${COINBASE_WITHDRAW_RESERVE_FLOOR_SAT:-10000}
      - COINBASE_WITHDRAW_RESERVE_MULTIPLIER=${COINBASE_WITHDRAW_RESERVE_MULTIPLIER:-2}
      # OpenTelemetry: traces -> Alloy -> Tempo; structured logs scraped from stdout.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-alloy:4317}
      - OTEL_SERVICE_NAME=unified-api
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-1.0}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DEPLOY_ENV=${DEPLOY_ENV:-production}
      # Validates the dashboard login session cookie; default Secure=true (prod is
      # HTTPS). Export SESSION_COOKIE_SECURE=false for local HTTP dev.
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:-}
    volumes:
      - ./dexUnifiedApi/.env:/app/.env:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Generous start window so a slow start during a full-stack recreate on a
      # memory-constrained VPS isn't misread as unhealthy and cascaded to dependents.
      # Covers synchronous Tor-proxied mempool fetch and live-book hydration
      # before the listener binds. Schema migration runs separately before
      # candidate app activation.
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    restart: unless-stopped

  unified-snapshot:
    logging: *default-logging
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-kv055}/dexarbtrading-unified-snapshot:${UNIFIED_SNAPSHOT_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    depends_on:
      postgres:
        condition: service_healthy
      tor:
        condition: service_healthy
      unified-api:
        condition: service_healthy
    env_file:
      - ./dexUnifiedApi/.env
    environment:
      - POSTGRES_HOST=postgres
      - BISQ_GRPC_HOST=bisq:9998
      - BISQ_API_PASSWORD=${BISQ_API_PASSWORD:-}
      - BISQ2_REST_HOST=bisq2:8090
      - BISQ2_API_PASSWORD=${BISQ2_API_PASSWORD:-}
      - PRICE_PROVIDER=bisq_tor
      - SNAPSHOT_INTERVAL_MIN=${SNAPSHOT_INTERVAL_MIN:-1}
      # Failed source fetches retain their last confirmed offers for this grace;
      # a successful snapshot still removes absent offers immediately.
      - LIVE_OFFER_STALE_GRACE=5m
      - CLOSED_OFFER_ANALYSIS_GRACE_CYCLES=3
      # Drop order_lifecycle rows older than this many days. 0 disables the
      # sweep. Batched with a per-cycle time budget so a 47M-row backlog drains
      # across several snapshot passes instead of stalling one cycle.
      - LIFECYCLE_RETENTION_DAYS=${LIFECYCLE_RETENTION_DAYS:-30}
      # A full eight-currency pass can exceed three minutes while Tor-backed
      # sources time out. Keep the worker healthy throughout a valid pass.
      - SNAPSHOT_HEALTH_MAX_AGE_SEC=900
      - SERVER_INTERNAL_URL=http://unified-api:5010
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:-}
      - TOR_PROXY_URL=socks5h://tor:9050
      # Keep coordinator discovery current without baking a stale federation
      # list into the snapshot image. The worker falls back safely on failure.
      - ROBOSATS_FEDERATION_URL=${ROBOSATS_FEDERATION_URL:-https://raw.githubusercontent.com/RoboSats/robosats/main/frontend/static/federation.json}
      - ROBOSATS_FEDERATION_REFRESH_INTERVAL=${ROBOSATS_FEDERATION_REFRESH_INTERVAL:-6h}
      # Snapshot-only Noones ingestion (offer/all book + inline maker
      # reputation; no taker connector). Empty credentials keep the venue out
      # of the fetcher list entirely instead of failing every market.
      - NOONES_CLIENT_ID=${NOONES_CLIENT_ID:-}
      - NOONES_CLIENT_SECRET=${NOONES_CLIENT_SECRET:-}
      # OpenTelemetry: traces -> Alloy -> Tempo; structured logs scraped from stdout.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-alloy:4317}
      - OTEL_SERVICE_NAME=unified-snapshot
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-1.0}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DEPLOY_ENV=${DEPLOY_ENV:-production}
    volumes:
      - ./dexUnifiedApi/.env:/app/.env:ro
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
    restart: unless-stopped

  # postgres-backup:
  #   logging: *default-logging
  #   image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-kv055}/dexarbtrading-postgres-backup:${POSTGRES_BACKUP_IMAGE_TAG:-${IMAGE_TAG:-latest}}
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   env_file:
  #     - ./.env
  #   environment:
  #     - POSTGRES_DB=${POSTGRES_DB}
  #     - POSTGRES_ADMIN_USER=${POSTGRES_ADMIN_USER}
  #     - POSTGRES_ADMIN_PASSWORD=${POSTGRES_ADMIN_PASSWORD}
  #     - PG_BACKUP_POSTGRES_HOST=postgres
  #     - PG_BACKUP_POSTGRES_PORT=5432
  #     - PG_BACKUP_DIR=/backups
  #     - PG_BACKUP_ENABLED=${PG_BACKUP_ENABLED:-true}
  #     - PG_BACKUP_FILE_PREFIX=${PG_BACKUP_FILE_PREFIX:-dexarb}
  #     - PG_BACKUP_INTERVAL=${PG_BACKUP_INTERVAL:-6h}
  #     - PG_BACKUP_RETENTION_DAYS=${PG_BACKUP_RETENTION_DAYS:-14}
  #     - PG_BACKUP_UPLOAD=${PG_BACKUP_UPLOAD:-true}
  #     - PG_BACKUP_UPLOAD_REQUIRED=${PG_BACKUP_UPLOAD_REQUIRED:-true}
  #     - PG_BACKUP_RCLONE_REMOTE=${PG_BACKUP_RCLONE_REMOTE:-proton:postgres-backups/dexarb}
  #     - PG_BACKUP_COMMAND_TIMEOUT=${PG_BACKUP_COMMAND_TIMEOUT:-2h}
  #   volumes:
  #     - postgres-backups:/backups
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 128M
  #         cpus: '0.25'
  #   restart: unless-stopped

  dexmonitor:
    logging: *default-logging
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-kv055}/dexarbtrading-dexmonitor:${DEXMONITOR_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    depends_on:
      unified-api:
        condition: service_healthy
    env_file:
      - ./dexMonitor/.env
    environment:
      - DATABASE_URL=postgres://dex_monitor:${POSTGRES_MONITOR_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - SNAPSHOT_INTERVAL_MIN=${SNAPSHOT_INTERVAL_MIN:-1}
      - FRONTEND_DIR=/app/react-frontend/dist
      - MM_CONTROLLER_API_URL=http://mm-controller:5001
      # Must match mm-controller's INTERNAL_API_SECRET: every proxied
      # /api/mm-controller/* call carries it as X-Internal-Secret.
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}
      - UNIFIED_API_URL=http://unified-api:5010
      # Private controller access is used only to show authenticated operators
      # phone setup health and reveal deployment-managed setup credentials.
      - FIAT_CONTROLLER_URL=http://fiat-controller:8080
      - PUSHPUSH_NOTIFY_SECRET=${PUSHPUSH_NOTIFY_SECRET:-}
      - PUSHPUSH_HEARTBEAT_MAX_AGE=${PUSHPUSH_HEARTBEAT_MAX_AGE:-15m}
      - MM_CEX_CAPABILITY_MAX_AGE=${MM_CEX_CAPABILITY_MAX_AGE:-30m}
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:-}
      - TOR_PROXY_ADDR=tor:9050
      - BISQ_GRPC_HOST=bisq:9998
      - BISQ_API_PASSWORD=${BISQ_API_PASSWORD:-}
      # OpenTelemetry: traces -> Alloy -> Tempo; structured logs scraped from stdout.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-alloy:4317}
      - OTEL_SERVICE_NAME=dexmonitor
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-1.0}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DEPLOY_ENV=${DEPLOY_ENV:-production}
      # Login session cookie Secure attribute. Defaults to true (prod is HTTPS).
      # Export SESSION_COOKIE_SECURE=false for local HTTP dev (e.g. the Vite dev
      # server on http://localhost:5173), where browsers drop Secure cookies and
      # the session would never persist.
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      # - LND_HOST=https://localhost:8080
      # - LND_MACAROON_PATH=/lnd/admin.macaroon
      # - LND_TLS_CERT_PATH=/lnd/tls.cert
      # LND wallet password: set accounts.password via dexMonitor (not env).
    volumes:
      # Read-only access is only used to create an operator-requested Bisq 1
      # data-directory archive for recovery in a local Bisq GUI.
      - bisq-data:/bisq-data:ro
    # - lnd-data:/lnd:ro  # read-only access to macaroon + tls cert
    # Optional: mount the ROOT .env read-write so the Settings page
    # (PUT /api/app-settings) can persist user-facing variables. Requires two
    # changes: root .env values are only compose interpolation and are NOT
    # auto-injected into the container, so the mount alone is not enough.
    #   1. uncomment the volume below, and
    #   2. add "- SETTINGS_ENV_FILE=/settings/root.env" to the environment
    #      list above (or set it in dexMonitor/.env).
    # Without both, the page stays read-only. Each save keeps a rotating
    # .env.bak next to the file; recreate the listed services afterwards
    # (`docker compose up -d <services>`) for changes to take effect.
    # - ./.env:/settings/root.env:rw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # See unified-api: generous start window to avoid false-unhealthy under load.
      start_period: 40s
    deploy:
      resources:
        limits:
          # 256M still OOM-killed under dashboard burst + lifecycle aggregates;
          # 512M gives headroom while backend deduplication lands.
          memory: 512M
          cpus: '0.5'
    ports:
      - "127.0.0.1:5002:5000"
    restart: unless-stopped

  nginx:
    logging: *default-logging
    image: nginx:1.31-alpine
    # No edge basic-auth: the application enforces login (dexMonitor session
    # cookie, validated by dexMonitor and unified-api). Stock entrypoint runs nginx.
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # TLS material (gitignored, never committed). Provisioning installs a
      # Let's Encrypt certificate; CI keeps a self-signed recovery guard.
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - ./deploy/nginx/acme-webroot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      dexmonitor:
        condition: service_healthy
      unified-api:
        condition: service_healthy
      grafana:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: '0.1'
    restart: unless-stopped

  # Run on demand for certificate issuance and from the host renewal timer.
  # nginx serves the shared webroot while Certbot writes ACME challenges to it.
  certbot:
    image: certbot/certbot:v5.10.0
    profiles: ["certbot"]
    volumes:
      - ./deploy/nginx/acme-webroot:/var/www/certbot
      - ./deploy/nginx/letsencrypt:/etc/letsencrypt

  mm-controller:
    logging: *default-logging
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-kv055}/dexarbtrading-mm-controller:${MM_CONTROLLER_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    # Bridge network: all upstreams (lnd, tor, unified-api, bisq) are reached
    # via docker DNS, not localhost. The 127.0.0.1:5001 publish below keeps
    # host-side callers (dev tooling, curl localhost:5001) working.
    env_file:
      - ./dexTakerController/.env
    depends_on:
      postgres:
        condition: service_healthy
      lnd:
        condition: service_healthy
      unified-api:
        condition: service_healthy
    environment:
      - DB_PATH=/app/mm-controller.db
      - API_ADDR=:5001
      - ENABLE_AUTOMATED_TRADEFLOW_WORKERS=${ENABLE_AUTOMATED_TRADEFLOW_WORKERS:-false}
      - ROBOSATS_ENABLED=${ROBOSATS_ENABLED:-false}
      - ROBOSATS_COORDINATORS=${ROBOSATS_COORDINATORS:-}
      - ROBOSATS_FEDERATION_URL=${ROBOSATS_FEDERATION_URL:-https://raw.githubusercontent.com/RoboSats/robosats/main/frontend/static/federation.json}
      # OpenTelemetry: traces -> Alloy -> Tempo; structured logs scraped from stdout.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-alloy:4317}
      - OTEL_SERVICE_NAME=mm-controller
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Keep the displayed daemon version available even while the encrypted
      # LND wallet is locked and /v1/getinfo cannot be queried.
      - LND_VERSION=${LND_VERSION:-0.18.4-beta}
      # Postgres reached via docker DNS. mm-controller builds DATABASE_URL from
      # POSTGRES_HOST/PORT/DB/USER/PASSWORD (see resolveDatabaseURL in main.go),
      # so the bridge-network host is set here without re-stating credentials.
      - POSTGRES_HOST=postgres
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}
      - LND_HOST=https://lnd:8080
      # The manual LND health check uses this same in-network proxy and credentials
      # as LND, so it validates the actual configured pruned Bitcoin Core node.
      - LND_BITCOIND_RPC_URL=http://bitcoind-rpc-proxy:8332
      - LND_BITCOIND_RPCUSER=${LND_BITCOIND_RPCUSER}
      - LND_BITCOIND_RPCPASS=${LND_BITCOIND_RPCPASS}
      # One-shot operator escape hatch to create a separate empty wallet while
      # retaining recovery material for a previous wallet in Postgres.
      - LND_INIT_FRESH=${LND_INIT_FRESH:-false}
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:-}
      - LND_MACAROON_PATH=/lnd/data/chain/bitcoin/mainnet/admin.macaroon
      - LND_TLS_CERT_PATH=/lnd/tls.cert
      # Tor SOCKS proxy reached via docker DNS instead of the host loopback.
      - TOR_PROXY_URL=socks5h://tor:9050
      # Bisq daemon on the bridge network — fixes "dial tcp 127.0.0.1:9998:
      # connection refused" seen when this service was host-networked and the
      # bisq container did not publish 9998 to the host.
      - BISQ_GRPC_HOST=bisq:9998
      - BISQ_API_PASSWORD=${BISQ_API_PASSWORD:-}
      - BISQ_VERSION=1.10.11
      - BISQ2_REST_HOST=bisq2:8090
      - BISQ2_API_PASSWORD=${BISQ2_API_PASSWORD:-}
      - BISQ2_VERSION=2.1.15
      - ACCOUNT_HEALTH_INTERVAL=${ACCOUNT_HEALTH_INTERVAL:-10m}
      - MM_CEX_CAPABILITY_MAX_AGE=${MM_CEX_CAPABILITY_MAX_AGE:-30m}
      # Alert after a Bisq buyer's fiat-sent signal remains unmatched this long.
      # 0 disables; never auto-confirms fiat receipt or releases BTC.
      - BISQ_FIAT_ESCALATION_AFTER=${BISQ_FIAT_ESCALATION_AFTER:-2h}
      # RoboSats coordinators are Tor onion services; reach them through the
      # tor sidecar's SOCKS port on the bridge network (tor:9050).
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - DEXMM_TELEGRAM_WEBHOOK_URL=${DEXMM_TELEGRAM_WEBHOOK_URL:-}
      # Bid-side pre-trade checks fail closed unless the fiat controller is
      # reachable and the MacroDroid phone heartbeat is fresh.
      - FIAT_CONTROLLER_URL=${FIAT_CONTROLLER_URL:-http://fiat-controller:8080}
      - FIAT_CONTROLLER_HEARTBEAT_SECRET=${PUSHPUSH_NOTIFY_SECRET:-}
      # Shared bearer secret for the fiat-controller BTC-release webhook. The
      # sender side is PUSHPUSH_DEX_RELEASE_TOKEN; empty disables the webhook (503).
      - DEX_RELEASE_WEBHOOK_TOKEN=${PUSHPUSH_DEX_RELEASE_TOKEN:-}
      # Registered as secret_token on setWebhook; inbound /telegram-webhook
      # posts are rejected unless they echo it back (fail-closed when unset).
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      # - LND_SEED_MNEMONIC_FILE=/run/secrets/lnd_seed_mnemonic
      # - LND_AEZEED_PASSPHRASE_FILE=/run/secrets/lnd_aezeed_passphrase
      # - LND_RECOVERY_WINDOW=250
    ports:
      # Loopback only: host-side dev tooling / curl reaches the API. Sibling
      # containers use http://mm-controller:5001, not this publish.
      - "127.0.0.1:5001:5001"
    volumes:
      - lnd-data-fresh:/lnd:ro
      # - ./dexTakerController/secrets/lnd_seed_mnemonic:/run/secrets/lnd_seed_mnemonic:ro
      # - ./dexTakerController/secrets/lnd_aezeed_passphrase:/run/secrets/lnd_aezeed_passphrase:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5001/livez"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5m
    deploy:
      resources:
        limits:
          # 128M OOM-killed mm-controller (~129M RSS) during account-health
          # probes; 256M absorbs bursts while host swap covers host pressure.
          memory: 256M
          cpus: '0.5'
    restart: unless-stopped

  lnd:
    logging: *default-logging
    image: lightninglabs/lnd:v${LND_VERSION:-0.18.4-beta}
    # Bridge network: reachable from sibling containers at https://lnd:8080.
    # The TLS cert must include the "lnd" SAN (added below); see the one-time
    # cert-regeneration note in the README / migration comment before first up.
    # Public DNS only on this service: LND does not resolve sibling compose
    # names, and Docker's 127.0.0.11 has timed out Lightning Labs lookups.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - lnd-data-fresh:/root/.lnd
    depends_on:
      tor:
        condition: service_healthy
      bitcoind-rpc-proxy:
        condition: service_healthy
    ports:
      # Loopback only, for host-side lncli / debugging. Sibling containers use
      # the docker DNS name (lnd:8080 / lnd:10009), not these publishes.
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:10009:10009"
    healthcheck:
      test: ["CMD", "curl", "-sf", "--cacert", "/root/.lnd/tls.cert",
             "https://localhost:8080/v1/state"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    command:
      - --bitcoin.active
      - --bitcoin.mainnet
      - --bitcoin.node=bitcoind
      - --bitcoind.rpchost=bitcoind-rpc-proxy:8332
      - --bitcoind.rpcuser=${LND_BITCOIND_RPCUSER}
      - --bitcoind.rpcpass=${LND_BITCOIND_RPCPASS}
      # RPC polling avoids exposing a separate ZMQ endpoint through Tor.
      - --bitcoind.rpcpolling
      - --bitcoind.pruned-node-max-peers=4
      - --tor.active
      - --tor.socks=tor:9050
      - --fee.url=https://nodes.lightning.computer/fees/v1/btc-fee-estimates.json
      - --restlisten=0.0.0.0:8080
      - --rpclisten=0.0.0.0:10009
      - --tlsextraip=127.0.0.1
      - --tlsextradomain=localhost
      - --tlsextradomain=lnd
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    restart: unless-stopped

  # Maddy mail services are disabled for now. Keep this configuration here so
  # it can be restored when receive-only payment-mail ingestion is enabled.
